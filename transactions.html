<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SenteBot Transactions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --bg:#050A18;--card:#0E1629;--card2:#14243E;--green:#00E676;--cyan:#00D1FF;--red:#EF4444;--yellow:#FACC15;
  --text:#F8FAFC;--muted:#94A3B8;--border:rgba(0,209,255,.15);--shadow:0 18px 45px rgba(0,0,0,.45);
}
body{background:radial-gradient(1200px 600px at 50% -20%,rgba(0,209,255,.10),transparent 60%),linear-gradient(180deg,#050A18,#070B14);color:var(--text);min-height:100vh;padding-bottom:120px;}
.container{max-width:540px;margin:auto;padding:18px;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  /* BLOCK CHROME TAP TO SEARCH + LONG PRESS */
*{
  -webkit-touch-callout: none; /* iOS long press menu */
  -webkit-user-select: none;   /* Safari */
   -khtml-user-select: none;   /* Konqueror */
     -moz-user-select: none;   /* Firefox */
      -ms-user-select: none;   /* IE/Edge */
          user-select: none;   /* Standard */
}

/* Allow selection only in inputs */
input, textarea{
  -webkit-user-select: text;
     -moz-user-select: text;
      -ms-user-select: text;
          user-select: text;
}
.back-btn{width:46px;height:46px;border-radius:15px;background:rgba(0,209,255,.06);border:1px solid rgba(0,209,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.page-title{text-align:center;flex:1;}
.page-title h2{font-size:22px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* TABS */
.tab-wrap{display:flex;gap:10px;background:var(--card);padding:6px;border-radius:16px;margin-bottom:18px;border:1px solid var(--border);}
.tab{flex:1;padding:12px;text-align:center;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.3s;}
.tab.active{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;}

/* TRANSACTION CARD */
.tx-list{display:flex;flex-direction:column;gap:12px;}
.tx-card{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:20px;padding:16px;backdrop-filter:blur(16px);cursor:pointer;transition:.2s;}
.tx-card:active{transform:scale(.98);}
.tx-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.tx-icon.deposit{background:rgba(0,230,118,.15);color:var(--green);}
.tx-icon.withdraw{background:rgba(239,68,68,.15);color:var(--red);}
.tx-info{flex:1;}
.tx-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.tx-time{font-size:12px;color:var(--muted);}
.tx-amount{font-size:16px;font-weight:800;}
.tx-amount.pos{color:var(--green);}
.tx-amount.neg{color:var(--red);}
.tx-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin-top:6px;display:inline-block;}
.status-PENDING{background:rgba(250,204,21,.15);color:var(--yellow);}
.status-APPROVED{background:rgba(0,230,118,.15);color:var(--green);}
.status-REJECTED{background:rgba(239,68,68,.15);color:var(--red);}

.empty{ text-align:center; padding:40px 20px; color:var(--muted);}
.empty i{font-size:48px;margin-bottom:12px;opacity:.5;}
.loading-box{display:flex;justify-content:center;padding:40px;}
.loader{width:35px;height:35px;border:3px solid rgba(0,209,255,.2);border-top:3px solid var(--cyan);border-radius:50%;animation:spin.8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}

/* TOAST NOTIFICATION */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);padding:14px 24px;border-radius:14px;font-weight:800;font-size:14px;display:none;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:slideUp.3s ease;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.toast.success{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;}
.toast.error{background:var(--red);color:#fff;}
.toast.info{background:linear-gradient(90deg,#6366F1,#8B5CF6);color:#fff;}

.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:540px;height:74px;background:rgba(8,16,32,.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 15px 45px rgba(0,0,0,.45);z-index:999;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;}
.nav-item.active{color:var(--cyan);font-weight:700;}
.nav-item.active.nav-icon{background:rgba(0,209,255,.15);color:var(--cyan);box-shadow:0 0 18px rgba(0,209,255,.35);}
</style>
</head>
  <meta name="google" content="notranslate">
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='wallet.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title"><h2>Transactions</h2></div>
        <div style="width:46px;"></div>
    </div>

    <div class="tab-wrap">
        <div class="tab active" data-tab="all"><i class="fa-solid fa-list"></i> All</div>
        <div class="tab" data-tab="deposit"><i class="fa-solid fa-arrow-down"></i> Deposits</div>
        <div class="tab" data-tab="withdraw"><i class="fa-solid fa-arrow-up"></i> Withdrawals</div>
    </div>

    <div id="txList" class="tx-list">
        <div class="loading-box"><div class="loader"></div></div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
    <div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
    <div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
    <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let allTransactions = [];
let currentTab = 'all';

/* PURE TOAST NOTIFICATION - NO ALERTS */
let toastTimeout;
function showToast(message, type="success"){
    const toast=document.getElementById("toast");
    clearTimeout(toastTimeout);
    toast.textContent=message;
    toast.className="toast " + type;
    toast.style.display="block";
    toastTimeout = setTimeout(()=>{toast.style.display="none";},3000);
}

onAuthStateChanged(auth,(user)=>{
    if(!user){window.location.href="index.html";return;}
    loadTransactions(user.uid);
});

function loadTransactions(uid){
    let depositsData = [];
    let withdrawalsData = [];

    const depositsRef = ref(db, `users/${uid}/deposits`);
    const withdrawalsRef = ref(db, `users/${uid}/withdrawals`);

    onValue(depositsRef, (snap) => {
        const deposits = snap.val() || {};
        depositsData = Object.keys(deposits).map(key => ({...deposits[key], id: key, type: 'deposit'}));
        mergeAndRender(depositsData, withdrawalsData);
    });

    onValue(withdrawalsRef, (snap) => {
        const withdrawals = snap.val() || {};
        withdrawalsData = Object.keys(withdrawals).map(key => ({...withdrawals[key], id: key, type: 'withdraw'}));
        mergeAndRender(depositsData, withdrawalsData);
    });
}

function mergeAndRender(deposits, withdrawals){
    allTransactions = [...deposits,...withdrawals];
    // sort by date newest first
    allTransactions.sort((a,b) => (b.createdAt || b.requestedAt || 0) - (a.createdAt || a.requestedAt || 0));
    renderTransactions();
}

// Fixed: use event delegation instead of inline onclick
document.querySelector('.tab-wrap').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if(!tab) return;
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderTransactions();
});

function renderTransactions(){
    const container = document.getElementById('txList');
    let filtered = allTransactions;
    if(currentTab!== 'all') filtered = allTransactions.filter(t => t.type === currentTab);

    if(filtered.length === 0){
        container.innerHTML = `<div class="empty"><i class="fa-solid fa-receipt"></i><p>No transactions yet</p></div>`;
        return;
    }

    container.innerHTML = filtered.map(tx => {
        const isDeposit = tx.type === 'deposit';
        const amount = tx.amount || 0;
        const time = new Date(tx.createdAt || tx.requestedAt || Date.now()).toLocaleString();
        const status = (tx.status || 'PENDING').toUpperCase();

        return `
        <div class="tx-card" onclick="showToast('TX ID: ${tx.id}', 'info')">
            <div class="tx-icon ${isDeposit? 'deposit' : 'withdraw'}">
                <i class="fa-solid ${isDeposit? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
            </div>
            <div class="tx-info">
                <div class="tx-title">${isDeposit? 'Deposit' : 'Withdrawal'}</div>
                <div class="tx-time">${time}</div>
                <span class="tx-status status-${status}">${status}</span>
            </div>
            <div class="tx-amount ${isDeposit? 'pos' : 'neg'}">
                ${isDeposit? '+' : '-'}UGX ${amount.toLocaleString()}
            </div>
        </div>
        `
    }).join('');
}

// Make showToast global for onclick
window.showToast = showToast;
  // Block long press and right click
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchstart', e => {
  if(e.touches.length > 1) e.preventDefault(); // block pinch
});
document.addEventListener('touchend', e => {
  if(e.touches.length > 1) e.preventDefault();
});

// Block 500ms long press
let touchTimer;
document.addEventListener('touchstart', e => {
  touchTimer = setTimeout(() => e.preventDefault(), 500);
});
document.addEventListener('touchend', () => clearTimeout(touchTimer));
document.addEventListener('touchmove', () => clearTimeout(touchTimer));
</script>
</body>
  </html>
