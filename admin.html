<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SenteBot Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{--bg:#050A18;--card:#0E1629;--green:#00E676;--cyan:#00D1FF;--red:#EF4444;--text:#F8FAFC;--muted:#94A3B8;--border:rgba(0,209,255,.15);}
body{background:radial-gradient(1200px 600px at 50% -20%,rgba(0,209,255,.12),transparent 60%),linear-gradient(180deg,#050A18,#070B14);color:var(--text);min-height:100vh;padding:20px;}
.container{max-width:540px;margin:auto;}
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.back-btn{width:46px;height:46px;border-radius:15px;background:rgba(0,209,255,.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.page-title h2{font-size:22px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.admin-card{background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));border:1px solid var(--border);border-radius:22px;padding:20px;margin-bottom:16px;backdrop-filter:blur(16px);}
.admin-card h3{font-size:16px;font-weight:800;margin-bottom:10px;color:var(--green);}
.admin-card p{font-size:13px;color:var(--muted);margin-bottom:16px;}

.seed-btn{width:100%;background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s;}
.seed-btn:active{transform:scale(.97);}
.seed-btn:disabled{opacity:.5;cursor:not-allowed;}

#status{margin-top:14px;font-size:13px;color:var(--muted);text-align:center;min-height:20px;}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="back-btn" onclick="window.location='profile.html'"><i class="fa-solid fa-arrow-left"></i></div>
    <div class="page-title"><h2>Admin Panel</h2></div>
  </div>

  <div class="admin-card">
    <h3><i class="fa-solid fa-database"></i> Machine Seeder</h3>
    <p>This will create 20 machines in Firebase Realtime Database at `/machines`. Run only once.</p>
    <button class="seed-btn" id="seedBtn"><i class="fa-solid fa-rocket"></i> Create 20 Machines</button>
    <div id="status"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const ADMIN_UID = "AQ1kRn34wlSGu0MPQfvRLXfmbqA3";

onAuthStateChanged(auth, user=>{
  if(!user || user.uid !== ADMIN_UID){
    window.location.href = "profile.html";
    return;
  }
});

document.getElementById("seedBtn").onclick = async () => {
  const btn = document.getElementById("seedBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.innerHTML = "⏳ Creating machines...";

  const machines=[
    {id:"machine1",name:"Nano AI Miner",category:"Starter",price:20000,dailyProfit:2000,duration:20,totalReturn:60000,icon:"fa-solid fa-microchip"},
    {id:"machine2",name:"Crypto Seed Bot",category:"Starter",price:50000,dailyProfit:5000,duration:20,totalReturn:150000,icon:"fa-solid fa-robot"},
    {id:"machine3",name:"Quantum Mini",category:"Starter",price:100000,dailyProfit:10000,duration:20,totalReturn:300000,icon:"fa-solid fa-brain"},
    {id:"machine4",name:"Smart Trader X1",category:"Starter",price:200000,dailyProfit:20000,duration:20,totalReturn:600000,icon:"fa-solid fa-chart-line"},
    {id:"machine5",name:"Alpha Core",category:"Starter",price:350000,dailyProfit:35000,duration:20,totalReturn:1050000,icon:"fa-solid fa-cube"},
    {id:"machine6",name:"Profit Engine",category:"Starter",price:500000,dailyProfit:50000,duration:20,totalReturn:1500000,icon:"fa-solid fa-gears"},
    {id:"machine7",name:"Auto Signal AI",category:"Starter",price:750000,dailyProfit:75000,duration:20,totalReturn:2250000,icon:"fa-solid fa-satellite-dish"},
    {id:"machine8",name:"Neural Profit",category:"Starter",price:1000000,dailyProfit:100000,duration:20,totalReturn:3000000,icon:"fa-solid fa-network-wired"},
    {id:"machine9",name:"Quantum Pro",category:"Starter",price:1500000,dailyProfit:150000,duration:20,totalReturn:4500000,icon:"fa-solid fa-bolt"},
    {id:"machine10",name:"Titan Miner",category:"Starter",price:2000000,dailyProfit:200000,duration:20,totalReturn:6000000,icon:"fa-solid fa-server"},
    {id:"machine11",name:"Galaxy Engine",category:"High Yield",price:2500000,dailyProfit:250000,duration:20,totalReturn:7500000,icon:"fa-solid fa-globe"},
    {id:"machine12",name:"Infinity AI",category:"High Yield",price:3000000,dailyProfit:300000,duration:20,totalReturn:9000000,icon:"fa-solid fa-infinity"},
    {id:"machine13",name:"Ultra Matrix",category:"High Yield",price:5000000,dailyProfit:500000,duration:20,totalReturn:15000000,icon:"fa-solid fa-layer-group"},
    {id:"machine14",name:"Diamond Node",category:"High Yield",price:7500000,dailyProfit:750000,duration:20,totalReturn:22500000,icon:"fa-solid fa-gem"},
    {id:"machine15",name:"Elite Quantum",category:"High Yield",price:10000000,dailyProfit:1000000,duration:20,totalReturn:30000000,icon:"fa-solid fa-crown"},
    {id:"machine16",name:"Hyper Chain",category:"High Yield",price:12000000,dailyProfit:1200000,duration:20,totalReturn:36000000,icon:"fa-solid fa-link"},
    {id:"machine17",name:"Neural Max",category:"High Yield",price:14000000,dailyProfit:1400000,duration:20,totalReturn:42000000,icon:"fa-solid fa-shield-halved"},
    {id:"machine18",name:"AI Master Core",category:"High Yield",price:16000000,dailyProfit:1600000,duration:20,totalReturn:48000000,icon:"fa-solid fa-atom"},
    {id:"machine19",name:"Ultimate Hash Pro",category:"High Yield",price:18000000,dailyProfit:1800000,duration:20,totalReturn:54000000,icon:"fa-solid fa-fire"},
    {id:"machine20",name:"SenteBot Supreme X",category:"High Yield",price:20000000,dailyProfit:2000000,duration:20,totalReturn:60000000,icon:"fa-solid fa-rocket"}
  ];

  try {
    for (const machine of machines) {
      status.innerHTML = `Creating ${machine.name}...`;
      await set(ref(db, "machines/" + machine.id), machine);
    }
    status.innerHTML = "✅ Successfully created all 20 machines in Realtime Database.";
    btn.innerHTML = `<i class="fa-solid fa-check"></i> Done`;
  } catch (e) {
    console.error(e);
    status.innerHTML = "❌ Error: " + e.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
