<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SenteBot Withdraw</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --bg:#050A18;--card:#0E1629;--card2:#14243E;--green:#00E676;--cyan:#00D1FF;--red:#EF4444;
  --text:#F8FAFC;--muted:#94A3B8;--border:rgba(0,209,255,.15);--shadow:0 18px 45px rgba(0,0,0,.45);
  --glow-cyan:0 0 25px rgba(0,209,255,.25);--glow-red:0 0 25px rgba(239,68,68,.25);
}
body{background:radial-gradient(1200px 600px at 50% -20%,rgba(239,68,68,.10),transparent 60%),linear-gradient(180deg,#050A18,#070B14);color:var(--text);min-height:100vh;padding-bottom:120px;}
.container{max-width:540px;margin:auto;padding:18px;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.back-btn{width:46px;height:46px;border-radius:15px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.page-title{text-align:center;flex:1;}
.page-title h2{font-size:22px;font-weight:800;background:linear-gradient(90deg,#fff,var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* BALANCE CARD */
.balance-card{background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));border-radius:28px;padding:24px;border:1px solid var(--border);box-shadow:var(--glow-cyan);margin-bottom:20px;backdrop-filter:blur(16px);}
.balance-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.balance-value{font-size:32px;font-weight:800;margin:10px 0;background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* WITHDRAW FORM */
.form-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:18px;backdrop-filter:blur(16px);}
.form-group{margin-bottom:20px;}
.form-label{font-size:13px;color:var(--muted);margin-bottom:10px;font-weight:600;}
.form-input{
  width:100%;height:56px;background:#0B1324;border:1px solid var(--border);border-radius:16px;
  padding:0 18px;color:#fff;font-size:16px;font-weight:700;outline:none;transition:.3s;
}
.form-input:focus{border-color:var(--cyan);box-shadow:var(--glow-cyan);}
.phone-display{display:flex;align-items:center;gap:12px;background:#0B1324;border:1px solid var(--border);border-radius:16px;padding:0 18px;height:56px;}
.phone-display i{color:var(--green);font-size:20px;}
.phone-display span{font-size:16px;font-weight:800;}
.phone-note{font-size:12px;color:var(--muted);margin-top:8px;}

.info-box{background:rgba(0,209,255,.08);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px;}
.info-box p{font-size:13px;color:var(--muted);line-height:1.6;}
.info-box strong{color:var(--cyan);}

.withdraw-btn{
  width:100%;height:56px;border:none;border-radius:18px;
  background:linear-gradient(90deg,var(--red),#DC2626);color:#fff;font-size:16px;font-weight:800;
  cursor:pointer;transition:.3s;box-shadow:var(--glow-red);
}
.withdraw-btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(1);}
.withdraw-btn:active{transform:scale(.98);}

.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:540px;height:74px;background:rgba(8,16,32,.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 15px 45px rgba(0,0,0,.45);z-index:999;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;}
.nav-item.active{color:var(--cyan);font-weight:700;}
.nav-item.active .nav-icon{background:rgba(0,209,255,.15);color:var(--cyan);box-shadow:0 0 18px rgba(0,209,255,.35);}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);padding:14px 24px;border-radius:14px;font-weight:800;font-size:14px;display:none;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.toast.success{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;}
.toast.error{background:var(--red);color:#fff;}
.loading-box{display:flex;justify-content:center;padding:20px;}
.loader{width:35px;height:35px;border:3px solid rgba(239,68,68,.2);border-top:3px solid var(--red);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='wallet.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title"><h2>Withdraw Funds</h2></div>
        <div style="width:46px;"></div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-value" id="walletBalance">UGX 0</div>
    </div>

    <div class="form-card">
        <div class="form-group">
            <div class="form-label">Withdrawal Number</div>
            <div class="phone-display" id="phoneDisplay">
                <div class="loading-box"><div class="loader"></div></div>
            </div>
            <div class="phone-note">* Withdrawals are only allowed to your registered number</div>
        </div>

        <div class="form-group">
            <div class="form-label">Amount to Withdraw</div>
            <input type="number" id="withdrawAmount" class="form-input" placeholder="Enter amount" min="1000">
        </div>

        <div class="info-box">
            <p><strong>Note:</strong> Minimum withdrawal is UGX 1,000. Processing takes 5-30 minutes. Fees: 1%</p>
        </div>

        <button class="withdraw-btn" id="withdrawBtn" onclick="requestWithdraw()" disabled>
            <i class="fa-solid fa-arrow-up"></i> Request Withdrawal
        </button>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
    <div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
    <div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
    <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser = null;
let currentUserData = null;
let userPhone = "";

/* BLOCK ZOOM */
let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* TOAST */
function showToast(message, type="success"){
    const toast=document.getElementById("toast");
    toast.textContent=message;
    toast.className="toast " + type;
    toast.style.display="block";
    setTimeout(()=>{toast.style.display="none";},3000);
}

/* MASK PHONE: 2567XX***123 */
function maskPhone(phone){
    if(!phone) return "";
    const str = phone.toString();
    if(str.length < 7) return str;
    return str.substring(0, 5) + "***" + str.substring(str.length - 3);
}

/* AUTH */
onAuthStateChanged(auth,(user)=>{
    if(!user){window.location.href="index.html";return;}
    currentUser = user;
    loadUser();
});

/* LOAD USER DATA */
function loadUser(){
    const userRef = ref(db,"users/" + currentUser.uid);
    onValue(userRef,(snapshot)=>{
        if(!snapshot.exists()) return;
        currentUserData = snapshot.val();
        const balance = Number(currentUserData.balance || 0);
        userPhone = currentUserData.phone || "";
        
        document.getElementById("walletBalance").textContent = "UGX " + balance.toLocaleString();
        document.getElementById("phoneDisplay").innerHTML = `
            <i class="fa-solid fa-phone"></i>
            <span>${maskPhone(userPhone)}</span>
        `;
        document.getElementById("withdrawBtn").disabled = false;
    });
}

/* REQUEST WITHDRAWAL */
window.requestWithdraw = async () => {
    if(!currentUser || !currentUserData) return;
    
    const amount = Number(document.getElementById("withdrawAmount").value);
    const balance = Number(currentUserData.balance || 0);
    const minWithdraw = 1000;
    const fee = Math.ceil(amount * 0.01); // 1% fee
    const totalDeduct = amount + fee;

    if(!userPhone){ showToast("No phone number registered", "error"); return; }
    if(amount < minWithdraw){ showToast("Minimum withdrawal is UGX 1,000", "error"); return; }
    if(totalDeduct > balance){ showToast("Insufficient balance", "error"); return; }

    try{
        const btn = document.getElementById("withdrawBtn");
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

        const userRef = ref(db, "users/" + currentUser.uid);
        const withdrawKey = push(ref(db, "withdrawals")).key;
        const activityKey = push(ref(db, `users/${currentUser.uid}/activities`)).key;

        const updates = {};
        // Deduct balance
        updates[`users/${currentUser.uid}/balance`] = balance - totalDeduct;
        // Add activity
        updates[`users/${currentUser.uid}/activities/${activityKey}`] = {
            icon: "fa-solid fa-arrow-up",
            title: "Withdrawal Request",
            amount: "-UGX " + amount.toLocaleString(),
            time: new Date().toLocaleString()
        };
        // Add to admin withdrawals queue
        updates[`withdrawals/${withdrawKey}`] = {
            uid: currentUser.uid,
            phone: userPhone,
            amount: amount,
            fee: fee,
            total: totalDeduct,
            status: "PENDING",
            requestedAt: Date.now()
        };

        await update(ref(db), updates);
        
        document.getElementById("withdrawAmount").value = "";
        showToast("Withdrawal request submitted", "success");
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-arrow-up"></i> Request Withdrawal`;
    } catch(error){
        console.error(error);
        showToast("Withdrawal failed", "error");
        document.getElementById("withdrawBtn").disabled = false;
        document.getElementById("withdrawBtn").innerHTML = `<i class="fa-solid fa-arrow-up"></i> Request Withdrawal`;
    }
};

/* VALIDATE INPUT */
document.getElementById("withdrawAmount").addEventListener("input", (e) => {
    const val = Number(e.target.value);
    const btn = document.getElementById("withdrawBtn");
    btn.disabled = val < 1000;
});
</script>
</body>
</html>
