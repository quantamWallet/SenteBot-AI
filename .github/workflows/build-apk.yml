name: Build SenteBot APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  # 1. Download repository files
  - name: Checkout Repository
    uses: actions/checkout@v4

  # 2. Install Java
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # 3. Install Android SDK
  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  # 4. Install Gradle
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.2'

  # 5. Create Android project
  - name: Create Android Project
    shell: bash
    run: |
      set -e

      mkdir -p app/src/main/java/com/sentebot/app
      mkdir -p app/src/main/assets
      mkdir -p app/src/main/res/drawable

      # Copy website files from the repository root.
      for file in *.html *.js *.css *.json *.png *.jpg *.jpeg *.svg *.webp *.ico; do
        if [ -f "$file" ]; then
          cp "$file" app/src/main/assets/
        fi
      done

      # Copy website files from www or dist when present.
      if [ -d "www" ]; then
        cp -r www/. app/src/main/assets/
      fi

      if [ -d "dist" ]; then
        cp -r dist/. app/src/main/assets/
      fi

      # Stop if the website entry point is missing.
      if [ ! -f "app/src/main/assets/index.html" ]; then
        echo "ERROR: index.html was not found."
        echo "Put index.html in the repository root, www/, or dist/."
        exit 1
      fi

      # Create Gradle settings.
      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = 'SenteBot'
      include ':app'
      EOF

      # Declare Android and Kotlin plugins.
      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.2.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
      }
      EOF

      # Configure the Android application.
      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
      }

      android {
          namespace 'com.sentebot.app'
          compileSdk 34

          defaultConfig {
              applicationId 'com.sentebot.app'
              minSdk 24
              targetSdk 34
              versionCode 9
              versionName '1.0.9'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = '17'
          }
      }
      EOF

      # Create Android manifest.
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

          <application
              android:allowBackup="true"
              android:usesCleartextTraffic="true"
              android:icon="@drawable/ic_launcher"
              android:label="SenteBot Ai"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|keyboardHidden|screenSize">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

              </activity>
          </application>
      </manifest>
      EOF

      # Create a fallback launcher icon.
      # Replace this with your actual logo if desired.
      cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
      <vector xmlns:android="http://schemas.android.com/apk/res/android"
          android:width="108dp"
          android:height="108dp"
          android:viewportWidth="108"
          android:viewportHeight="108">
          <path
              android:fillColor="#050A14"
              android:pathData="M0,0h108v108h-108z"/>
          <path
              android:fillColor="#20D94B"
              android:pathData="M54,12A42,42 0,1 0,54 96A42,42 0,1 0,54 12"/>
          <path
              android:fillColor="#050A14"
              android:pathData="M54,23A31,31 0,1 0,54 85A31,31 0,1 0,54 23"/>
          <path
              android:fillColor="#FFD447"
              android:pathData="M30,61 L46,45 L57,54 L77,32 L77,44 L58,66 L46,57 L30,73 Z"/>
      </vector>
      EOF

      # Create the Kotlin WebView activity.
      cat > app/src/main/java/com/sentebot/app/MainActivity.kt <<'EOF'
      package com.sentebot.app

      import android.app.Activity
      import android.os.Bundle
      import android.webkit.WebChromeClient
      import android.webkit.WebSettings
      import android.webkit.WebView
      import android.webkit.WebViewClient

      class MainActivity : Activity() {

          private lateinit var webView: WebView

          override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              webView = WebView(this)
              setContentView(webView)

              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.settings.allowFileAccess = true
              webView.settings.allowContentAccess = true
              webView.settings.mixedContentMode =
                  WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

              webView.webViewClient = WebViewClient()
              webView.webChromeClient = WebChromeClient()

              if (savedInstanceState != null) {
                  webView.restoreState(savedInstanceState)
              } else {
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }

          override fun onSaveInstanceState(outState: Bundle) {
              webView.saveState(outState)
              super.onSaveInstanceState(outState)
          }

          override fun onBackPressed() {
              if (webView.canGoBack()) {
                  webView.goBack()
              } else {
                  super.onBackPressed()
              }
          }

          override fun onDestroy() {
              webView.destroy()
              super.onDestroy()
          }
      }
      EOF

      echo "Website files copied:"
      ls -la app/src/main/assets/

  # 6. Build the debug APK
  - name: Build APK
    run: gradle :app:assembleDebug --stacktrace

  # 7. Confirm the APK exists
  - name: Verify APK
    run: |
      if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      ls -lh app/build/outputs/apk/debug/app-debug.apk

  # 8. Upload the APK for download
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SenteBot-Ai-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
