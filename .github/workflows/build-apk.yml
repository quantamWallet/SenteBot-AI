name: Build SenteBot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sentebot/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SenteBot-Android'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sentebot.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sentebot.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="SenteBot AI Investment"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sentebot/app/MainActivity.java <<'EOF'
          package com.sentebot.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.graphics.Bitmap;
          import android.view.ViewGroup;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.view.Gravity;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              private WebView webView;
              private ProgressBar progressBar;

              private static final String WEBSITE =
                  "https://quantamwallet.github.io/SenteBot-AI/";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  progressBar = new ProgressBar(
                      this, null,
                      android.R.attr.progressBarStyleHorizontal
                  );
                  progressBar.setMax(100);

                  root.addView(webView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  FrameLayout.LayoutParams params =
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          8,
                          Gravity.TOP
                      );
                  root.addView(progressBar, params);
                  setContentView(root);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(
                          WebView view, String url, Bitmap favicon
                      ) {
                          progressBar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(
                          WebView view, String url
                      ) {
                          progressBar.setVisibility(View.GONE);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view, WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          String host = uri.getHost();

                          if ("https".equalsIgnoreCase(scheme)
                              && "quantamwallet.github.io".equalsIgnoreCase(host)) {
                              return false;
                          }

                          if ("http".equalsIgnoreCase(scheme)
                              || "https".equalsIgnoreCase(scheme)) {
                              try {
                                  startActivity(new Intent(
                                      Intent.ACTION_VIEW, uri
                                  ));
                              } catch (Exception ignored) {
                              }
                              return true;
                          }

                          return true;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(
                          WebView view, int newProgress
                      ) {
                          progressBar.setProgress(newProgress);
                          if (newProgress >= 100) {
                              progressBar.setVisibility(View.GONE);
                          }
                      }
                  });

                  webView.loadUrl(WEBSITE);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SenteBot-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
