name: Build SenteBot APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.2'

  - name: Create Android Project
    shell: bash
    run: |
      set -e

      mkdir -p app/src/main/java/com/sentebot/app
      mkdir -p app/src/main/assets
      mkdir -p app/src/main/res/drawable

      # Copy website files from the repository root.
      for file in *.html *.js *.css *.json *.png *.jpg *.jpeg *.svg *.webp *.ico; do
        if [ -f "$file" ]; then
          cp "$file" app/src/main/assets/
        fi
      done

      # Copy website directories when available.
      if [ -d "www" ]; then
        cp -r www/. app/src/main/assets/
      fi

      if [ -d "dist" ]; then
        cp -r dist/. app/src/main/assets/
      fi

      # Confirm that the website entry point exists.
      if [ ! -f "app/src/main/assets/index.html" ]; then
        echo "ERROR: index.html is missing."
        echo "Place index.html in the repository root, www/, or dist/."
        exit 1
      fi

      # Generate settings.gradle.
      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = 'SenteBot'
      include ':app'
      EOF

      # Generate root build.gradle.
      cat > build.gradle <<'EOF'
      plugins {
          id 'com.android.application' version '8.2.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
      }
      EOF

      # Generate app/build.gradle.
      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
      }

      android {
          namespace 'com.sentebot.app'
          compileSdk 34

          defaultConfig {
              applicationId 'com.sentebot.app'
              minSdk 24
              targetSdk 34
              versionCode 9
              versionName '1.0.9'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = '17'
          }
      }
      EOF

      # Generate AndroidManifest.xml.
      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

          <application
              android:allowBackup="true"
              android:usesCleartextTraffic="true"
              android:icon="@drawable/ic_launcher"
              android:label="SenteBot Ai"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|keyboardHidden|screenSize">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

              </activity>
          </application>
      </manifest>
      EOF

      # Generate a simple fallback launcher icon.
      cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
      <shape xmlns:android="http://schemas.android.com/apk/res/android"
          android:shape="rectangle">
          <corners android:radius="24dp" />
          <solid android:color="#20D94B" />
          <stroke
              android:width="4dp"
              android:color="#FFD447" />
      </shape>
      EOF

      # Generate MainActivity.kt.
      cat > app/src/main/java/com/sentebot/app/MainActivity.kt <<'EOF'
      package com.sentebot.app

      import android.app.Activity
      import android.os.Bundle
      import android.webkit.WebChromeClient
      import android.webkit.WebSettings
      import android.webkit.WebView
      import android.webkit.WebViewClient

      class MainActivity : Activity() {

          private lateinit var webView: WebView

          override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              webView = WebView(this)
              setContentView(webView)

              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.settings.allowFileAccess = true
              webView.settings.allowContentAccess = true
              webView.settings.mixedContentMode =
                  WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

              webView.webViewClient = WebViewClient()
              webView.webChromeClient = WebChromeClient()

              if (savedInstanceState != null) {
                  webView.restoreState(savedInstanceState)
              } else {
                  webView.loadUrl("file:///android_asset/index.html")
              }
          }

          @Deprecated("Deprecated in Android API")
          override fun onBackPressed() {
              if (::webView.isInitialized && webView.canGoBack()) {
                  webView.goBack()
              } else {
                  super.onBackPressed()
              }
          }

          override fun onDestroy() {
              if (::webView.isInitialized) {
                  webView.destroy()
              }
              super.onDestroy()
          }
      }
      EOF

      echo "Android project files created."
      echo "Website assets:"
      ls -la app/src/main/assets/

  - name: Build APK
    run: gradle :app:assembleDebug --stacktrace

  - name: Verify APK
    shell: bash
    run: |
      set -e
      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not generated."
        exit 1
      fi

      echo "APK generated successfully:"
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: SenteBot-Ai-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
