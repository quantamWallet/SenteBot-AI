<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SenteBot | Investment Machines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#050A18;
    --card:#0E1629;
    --card2:#14243E;
    --green:#00E676;
    --cyan:#00D1FF;
    --gold:#FFD166;
    --text:#F8FAFC;
    --muted:#94A3B8;
    --border:rgba(0,209,255,.15);

    --glow-cyan:
        0 0 30px rgba(0,209,255,.18);

    --glow-green:
        0 0 30px rgba(0,230,118,.18);
}

/* =========================================================
   GLOBAL
========================================================= */

html{
    background:#050A18;
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(
            900px 500px at 50% -15%,
            rgba(0,209,255,.14),
            transparent 65%
        ),
        radial-gradient(
            700px 500px at 100% 40%,
            rgba(0,230,118,.045),
            transparent 65%
        ),
        linear-gradient(
            180deg,
            #050A18 0%,
            #070B14 55%,
            #050914 100%
        );

    color:var(--text);
    min-height:100vh;
    padding-bottom:120px;
}

/* BLOCK CHROME TAP TO SEARCH + LONG PRESS */

*{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -khtml-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

input,
textarea{
    -webkit-user-select:text;
    -moz-user-select:text;
    -ms-user-select:text;
    user-select:text;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:540px;
    margin:0 auto;
    padding:18px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    position:relative;
}

.back-btn{
    width:46px;
    height:46px;
    flex-shrink:0;

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(0,209,255,.10),
            rgba(255,255,255,.025)
        );

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    color:var(--text);

    cursor:pointer;
    transition:.3s;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.back-btn:hover{
    border-color:rgba(0,209,255,.45);
    box-shadow:var(--glow-cyan);
    transform:translateX(-2px);
}

.page-title{
    text-align:center;
    flex:1;
    padding:0 12px;
}

.page-title h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.5px;

    background:
        linear-gradient(
            90deg,
            #FFFFFF,
            var(--cyan)
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.page-title p{
    font-size:12px;
    color:var(--muted);
    margin-top:5px;
}

.header-right{
    width:46px;
    flex-shrink:0;
}

/* =========================================================
   BALANCE CARD
========================================================= */

.balance-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(20,36,62,.96),
            rgba(8,17,33,.94)
        );

    border-radius:26px;
    padding:24px;

    border:1px solid rgba(0,209,255,.18);

    box-shadow:
        0 15px 45px rgba(0,0,0,.28),
        0 0 35px rgba(0,209,255,.08);

    margin-bottom:24px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

/* decorative glow */

.balance-card::before{
    content:"";
    position:absolute;

    width:180px;
    height:180px;

    right:-80px;
    top:-100px;

    background:
        radial-gradient(
            circle,
            rgba(0,209,255,.18),
            transparent 70%
        );

    pointer-events:none;
}

.balance-card::after{
    content:"";
    position:absolute;

    width:140px;
    height:140px;

    left:-90px;
    bottom:-100px;

    background:
        radial-gradient(
            circle,
            rgba(0,230,118,.10),
            transparent 70%
        );

    pointer-events:none;
}

.balance-label{
    position:relative;
    z-index:1;

    font-size:11px;
    color:var(--muted);

    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
}

.balance-value{
    position:relative;
    z-index:1;

    font-size:34px;
    line-height:1.1;

    font-weight:800;

    margin:10px 0 16px;

    letter-spacing:-1px;

    background:
        linear-gradient(
            90deg,
            var(--green),
            var(--cyan)
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    word-break:break-word;
}

.balance-info{
    position:relative;
    z-index:1;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-top:14px;

    border-top:1px solid rgba(255,255,255,.06);

    font-size:11px;
    color:var(--muted);
}

.balance-info span:last-child{
    color:var(--cyan);
    font-weight:800;
}

/* =========================================================
   CATEGORY TABS
========================================================= */

.category-tabs{
    display:flex;
    gap:9px;

    overflow-x:auto;

    padding:2px 2px 8px;
    margin-bottom:22px;

    scrollbar-width:none;
}

.category-tabs::-webkit-scrollbar{
    display:none;
}

.category{
    padding:11px 17px;

    border-radius:30px;

    background:
        rgba(255,255,255,.035);

    border:1px solid rgba(0,209,255,.12);

    white-space:nowrap;

    font-size:12px;
    font-weight:800;

    color:var(--muted);

    cursor:pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        color .25s ease,
        border .25s ease,
        box-shadow .25s ease;
}

.category:hover{
    color:var(--text);
    border-color:rgba(0,209,255,.35);
}

.category:active{
    transform:scale(.96);
}

.category.active{
    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--green)
        );

    color:#031017;

    border-color:transparent;

    box-shadow:
        0 7px 25px rgba(0,209,255,.18);
}

/* =========================================================
   MACHINE LIST
========================================================= */

.machine-list{
    display:flex;
    flex-direction:column;
    gap:17px;
}

/* =========================================================
   MACHINE CARD
========================================================= */

.machine-card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            rgba(20,36,62,.94),
            rgba(10,18,34,.96)
        );

    border:1px solid rgba(0,209,255,.13);

    border-radius:24px;

    padding:20px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.28);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transition:
        transform .3s ease,
        border .3s ease,
        box-shadow .3s ease;
}

/* subtle top shine */

.machine-card::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(0,209,255,.45),
            transparent
        );

    opacity:.7;
}

.machine-card:hover{
    transform:translateY(-3px);

    border-color:
        rgba(0,209,255,.28);

    box-shadow:
        0 18px 45px rgba(0,0,0,.35),
        0 0 25px rgba(0,209,255,.08);
}

/* =========================================================
   MACHINE TOP
========================================================= */

.machine-top{
    display:flex;
    align-items:center;
    gap:15px;

    margin-bottom:20px;
}

.machine-icon{
    width:60px;
    height:60px;

    flex-shrink:0;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(0,209,255,.17),
            rgba(0,230,118,.10)
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
    color:var(--cyan);

    border:1px solid rgba(0,209,255,.18);

    box-shadow:
        inset 0 0 20px rgba(0,209,255,.04),
        0 8px 22px rgba(0,0,0,.18);
}

.machine-name{
    font-size:17px;
    font-weight:800;

    line-height:1.3;

    letter-spacing:-.2px;
}

.machine-status{
    margin-top:6px;

    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:5px 10px;

    border-radius:30px;

    font-size:10px;
    font-weight:800;

    letter-spacing:.3px;
}

.machine-status::before{
    content:"";

    width:6px;
    height:6px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 8px currentColor;
}

.machine-status.available{
    background:rgba(0,230,118,.10);
    color:var(--green);
}

.machine-status.active{
    background:rgba(0,209,255,.10);
    color:var(--cyan);
}

.machine-status.completed{
    background:rgba(148,163,184,.10);
    color:var(--muted);
}

/* =========================================================
   MACHINE GRID
========================================================= */

.machine-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;

    margin-bottom:18px;
}

.machine-grid > div{
    min-width:0;

    padding:12px;

    border-radius:14px;

    background:
        rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.045);
}

.machine-grid small{
    display:block;

    color:var(--muted);

    font-size:10px;

    margin-bottom:6px;

    text-transform:uppercase;

    letter-spacing:.4px;
}

.machine-grid strong{
    display:block;

    font-size:13px;
    font-weight:800;

    color:var(--text);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.machine-grid > div:nth-child(2) strong{
    color:var(--green);
}

.machine-grid > div:nth-child(4) strong{
    color:var(--cyan);
}

/* =========================================================
   PROGRESS
========================================================= */

.machine-progress{
    margin-top:5px;
    margin-bottom:16px;

    padding:12px 13px;

    border-radius:15px;

    background:
        rgba(0,0,0,.12);

    border:1px solid rgba(255,255,255,.04);
}

.progress-top{
    display:flex;
    justify-content:space-between;

    font-size:10px;

    color:var(--muted);

    margin-bottom:8px;

    font-weight:700;
}

.progress-top span:last-child{
    color:var(--cyan);
}

.progress-bar{
    height:8px;

    background:#080F1D;

    border-radius:30px;

    overflow:hidden;

    box-shadow:
        inset 0 1px 4px rgba(0,0,0,.4);
}

.progress-fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--green)
        );

    border-radius:30px;

    transition:
        width .5s ease;

    box-shadow:
        0 0 12px rgba(0,209,255,.35);
}

/* =========================================================
   COUNTDOWN
========================================================= */

.countdown{
    font-size:11px;

    font-weight:800;

    color:var(--gold);

    text-align:center;

    margin-top:10px;
    margin-bottom:14px;

    padding:8px;

    border-radius:12px;

    background:
        rgba(255,209,102,.05);

    border:1px solid rgba(255,209,102,.08);
}

/* =========================================================
   BUTTONS
========================================================= */

.invest-btn{
    width:100%;
    height:52px;

    border:none;
    border-radius:16px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--green)
        );

    color:#05121A;

    font-size:13px;
    font-weight:900;

    cursor:pointer;

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;

    box-shadow:
        0 8px 22px rgba(0,209,255,.12);
}

.invest-btn:hover:not(:disabled){
    filter:brightness(1.08);

    transform:
        translateY(-1px);

    box-shadow:
        0 12px 28px rgba(0,209,255,.18);
}

.invest-btn:active:not(:disabled){
    transform:scale(.98);
}

.invest-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    filter:grayscale(.5);
    box-shadow:none;
}

.claim-btn{
    background:
        linear-gradient(
            90deg,
            var(--gold),
            #F59E0B
        );

    box-shadow:
        0 8px 22px rgba(245,158,11,.12);
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
        rgba(0,0,0,.78);

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:9999;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.modal-box{
    width:100%;
    max-width:380px;

    background:
        linear-gradient(
            160deg,
            #111C32,
            #080F1E
        );

    border:1px solid rgba(0,209,255,.18);

    border-radius:26px;

    padding:28px;

    text-align:center;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 35px rgba(0,209,255,.08);
}

.modal-icon{
    width:72px;
    height:72px;

    margin:auto;

    border-radius:21px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--green)
        );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    color:#05121A;

    margin-bottom:18px;

    box-shadow:
        0 12px 30px rgba(0,209,255,.15);
}

.modal-box h2{
    font-size:21px;
    font-weight:800;

    margin-bottom:10px;
}

.modal-box p{
    color:var(--muted);

    line-height:1.65;

    margin-bottom:24px;

    font-size:13px;
}

.modal-buttons{
    display:flex;
    gap:12px;
}

.modal-buttons button{
    flex:1;

    height:50px;

    border:none;

    border-radius:14px;

    font-weight:800;
    font-size:14px;

    cursor:pointer;

    transition:.2s;
}

.cancel-btn{
    background:#1A263B;
    color:white;
}

.cancel-btn:hover{
    background:#263750;
}

.confirm-btn{
    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--green)
        );

    color:#05121A;
}

.confirm-btn:hover{
    filter:brightness(1.08);
}

/* =========================================================
   CENTERED TOAST
========================================================= */

#toast{
    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.94);

    min-width:190px;
    max-width:calc(100% - 40px);

    padding:13px 20px;

    border-radius:15px;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--green)
        );

    color:#031017;

    font-size:12px;
    font-weight:900;

    line-height:1.4;

    text-align:center;

    display:none;

    opacity:0;

    pointer-events:none;

    z-index:10000;

    box-shadow:
        0 18px 55px rgba(0,0,0,.45),
        0 0 30px rgba(0,209,255,.15);

    animation:none;
}

#toast.toast-visible{
    display:block;

    opacity:1;

    animation:
        toastPop .25s ease forwards;
}

@keyframes toastPop{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.90);
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}

/* =========================================================
   LOADING
========================================================= */

.loading-box{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:70px 20px;

    color:var(--muted);

    font-size:12px;
}

.loader{
    width:45px;
    height:45px;

    border:4px solid rgba(0,209,255,.12);

    border-top:4px solid var(--cyan);

    border-right-color:var(--green);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin-bottom:18px;

    box-shadow:
        0 0 20px rgba(0,209,255,.12);
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state{
    text-align:center;

    padding:70px 20px;

    color:var(--muted);
}

.empty-state i{
    opacity:.75;

    filter:
        drop-shadow(
            0 0 15px rgba(0,209,255,.25)
        );
}

.empty-state h3{
    color:#fff;

    margin-bottom:10px;

    font-size:18px;
}

.empty-state p{
    font-size:13px;

    line-height:1.6;
}

/* =========================================================
   BOTTOM NAV
   EXISTING STRUCTURE / BUTTONS PRESERVED
========================================================= */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    width:calc(100% - 26px);
    max-width:540px;

    height:74px;

    background:
        rgba(8,16,32,.92);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:24px;

    display:flex;

    justify-content:space-around;
    align-items:center;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45);

    z-index:999;
}

.nav-item{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:5px;

    flex:1;

    font-size:11px;

    color:var(--muted);

    cursor:pointer;

    transition:.25s;
}

.nav-icon{
    width:42px;
    height:42px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    font-size:22px;

    transition:.2s;
}

.nav-item.active{
    color:var(--cyan);

    font-weight:700;
}

.nav-item.active .nav-icon{
    background:
        rgba(0,209,255,.15);

    color:var(--cyan);

    box-shadow:
        0 0 18px rgba(0,209,255,.35);
}

/* =========================================================
   MOBILE REFINEMENT
========================================================= */

@media(max-width:380px){

    .container{
        padding:14px;
    }

    .page-title h2{
        font-size:19px;
    }

    .page-title p{
        font-size:11px;
    }

    .balance-card{
        padding:20px;
    }

    .balance-value{
        font-size:29px;
    }

    .machine-card{
        padding:17px;
    }

    .machine-icon{
        width:55px;
        height:55px;
        font-size:23px;
    }

    .machine-name{
        font-size:15px;
    }

    .machine-grid{
        gap:8px;
    }

    .machine-grid > div{
        padding:10px;
    }

    .machine-grid strong{
        font-size:12px;
    }

    .bottom-nav{
        bottom:12px;
        height:70px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
  </style>
</head>
  <meta name="google" content="notranslate">
<body>

<!-- PURCHASE MODAL -->
<div id="purchaseModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-solid fa-microchip"></i></div>
        <h2 id="modalTitle">Purchase Machine</h2>
        <p id="modalText">Confirm your investment.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="confirm-btn" onclick="confirmPurchase()">Confirm</button>
        </div>
    </div>
</div>

<!-- INSUFFICIENT BALANCE MODAL -->
<div id="insufficientModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon" style="background:linear-gradient(135deg,#EF4444,#F97316);"><i class="fa-solid fa-wallet"></i></div>
        <h2>Insufficient Balance</h2>
        <p id="insufficientText">You don't have enough balance.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeInsufficient()">Cancel</button>
            <button class="confirm-btn" onclick="goToDeposit()">Deposit Now</button>
        </div>
    </div>
</div>

<!-- TOAST CENTERED -->
<div id="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title">
            <h2>Investment Machines</h2>
            <p>Choose an AI machine to start earning</p>
        </div>
        <div class="header-right"></div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-value" id="userBalance">UGX 0</div>
        <div class="balance-info">
            <span>Realtime Wallet</span>
            <span id="machineCount">0 Active</span>
        </div>
    </div>

    <div class="category-tabs">
        <div class="category active" data-category="All">All Machines</div>
        <div class="category" data-category="Starter">Starter Machines</div>
        <div class="category" data-category="High Yield">High Yield Machines</div>
    </div>

    <div id="machineList" class="machine-list"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
    <div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
    <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
    <div class="nav-item" onclick="window.location='wallet.html'"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentUserData = null;
let machinePlans = [];
window.currentCategory = "All";

/* CENTERED TOAST */
let toastTimeout;

window.showToast = (message, success = true) => {

    const toast = document.getElementById("toast");

    clearTimeout(toastTimeout);

    toast.textContent = message;

    toast.style.background = success
        ? "linear-gradient(90deg,#00D1FF,#00E676)"
        : "linear-gradient(90deg,#EF4444,#F97316)";

    toast.style.display = "block";

    toast.classList.remove("toast-visible");

    /* restart animation */
    void toast.offsetWidth;

    toast.classList.add("toast-visible");

    toastTimeout = setTimeout(() => {

        toast.classList.remove("toast-visible");

        setTimeout(() => {
            toast.style.display = "none";
        }, 250);

    }, 3000);
};

/* AUTH */
onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;
    showLoading();
    await loadMachinePlans();
    loadUser();
    let timer;

if (!timer) {
    timer = setInterval(renderMachines, 1000);
}
});

/* LOAD MACHINES - FIXED: reads from both machines + machinesCatalog */
async function loadMachinePlans() {
    const machinesRef = ref(db, "machines");
    const catalogRef = ref(db, "machinesCatalog"); // ADD THIS

    onValue(machinesRef, (snapshot) => {
        machinePlans = [];
        if(snapshot.exists()){
            snapshot.forEach(child => {
                const data = child.val();
                // Only add if it has required fields
                if(data.price && data.name && data.dailyProfit) {
                    machinePlans.push({ id: child.key,...data });
                }
            });
        }
        loadCatalog(); // load catalog too
    });

    function loadCatalog(){
        onValue(catalogRef, (snapshot) => {
            if(snapshot.exists()){
                snapshot.forEach(child => {
                    const data = child.val();
                    if(data.price && data.name && data.dailyProfit) {
                        // avoid duplicates
                        if(!machinePlans.find(m => m.id === child.key)){
                            machinePlans.push({ id: child.key,...data });
                        }
                    }
                });
            }
            machinePlans.sort((a,b) => Number(a.price) - Number(b.price));
            renderMachines();
        });
    }
}

/* LOAD USER */
function loadUser() {
    const userRef = ref(db, "users/" + currentUser.uid);
    onValue(userRef, (snapshot) => {
        if (!snapshot.exists()) return;
        currentUserData = snapshot.val();
        const balance = Number(currentUserData.balance || 0);
        const machines = currentUserData.machines? Object.values(currentUserData.machines) : [];
        const activeMachines = machines.filter(m => m.status === "RUNNING").length;
        document.getElementById("userBalance").textContent = "UGX " + balance.toLocaleString();
        document.getElementById("machineCount").textContent = activeMachines + " Active";
        renderMachines();
    });
}

/* RENDER MACHINES WITH COUNTDOWN + CLAIM */
function renderMachines() {
    const container = document.getElementById("machineList");
    if (!container) return;
    if(machinePlans.length === 0){ showLoading();
                     showEmpty();             
                    return; }

    let plans = [...machinePlans];
    if (window.currentCategory!== "All") plans = plans.filter(m => m.category === window.currentCategory);
    if(plans.length === 0){ showEmpty(); return; }

    const purchased = currentUserData?.machines || {};
    container.innerHTML = "";

    plans.forEach(plan => {
        const ownedKey = Object.keys(purchased).find(k => purchased[k].id === plan.id && purchased[k].status!== "COMPLETED");
        const owned = ownedKey? purchased[ownedKey] : null;

        let status = "Available";
        let buttonText = '<i class="fa-solid fa-bolt"></i> Invest Now';
        let buttonClass = "invest-btn";
        let buttonDisabled = false;
        let progressHtml = "";
        let countdownHtml = "";

        if (owned) {
            const now = Date.now();
            const nextClaimTime = owned.nextClaimAt || (owned.startDate + 86400000);
            const timeLeft = nextClaimTime - now;
            const elapsed = Math.floor((now - owned.startDate) / 86400000);
            const remaining = Math.max(plan.duration - elapsed, 0);
            const progress = Math.min(Math.floor((elapsed / plan.duration) * 100), 100);

            if(owned.status === "COMPLETED"){
                status = "COMPLETED";
                buttonText = '<i class="fa-solid fa-flag-checkered"></i> Completed';
                buttonDisabled = true;
            } else if(timeLeft <= 0){
                status = "RUNNING";
                buttonText = '<i class="fa-solid fa-coins"></i> Claim UGX ' + Number(plan.dailyProfit).toLocaleString();
                buttonClass = "invest-btn claim-btn";
                buttonDisabled = false;
            } else {
                status = "RUNNING";
                const hours = Math.floor(timeLeft / 3600000);
                const mins = Math.floor((timeLeft % 3600000) / 60000);
                const secs = Math.floor((timeLeft % 60000) / 1000);
                countdownHtml = `<div class="countdown"><i class="fa-solid fa-clock"></i> Next Claim: ${hours}h ${mins}m ${secs}s</div>`;
                buttonText = '<i class="fa-solid fa-hourglass"></i> Claimed';
                buttonDisabled = true;
            }
            progressHtml = `
            <div class="machine-progress">
                <div class="progress-top"><span>${remaining} Days Left</span><span>${progress}%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>`;
        }

        container.innerHTML += `
        <div class="machine-card">
            <div class="machine-top">
                <div class="machine-icon"><i class="${plan.icon || 'fa-solid fa-microchip'}"></i></div>
                <div>
                    <div class="machine-name">${plan.name}</div>
                    <div class="machine-status ${owned? status.toLowerCase() : "available"}">${status}</div>
                </div>
            </div>
            <div class="machine-grid">
                <div><small>Investment</small><strong>UGX ${Number(plan.price).toLocaleString()}</strong></div>
                <div><small>Daily Profit</small><strong>UGX ${Number(plan.dailyProfit).toLocaleString()}</strong></div>
                <div><small>Duration</small><strong>${plan.duration} Days</strong></div>
                <div><small>Total Return</small><strong>UGX ${Number(plan.totalReturn).toLocaleString()}</strong></div>
            </div>
            ${progressHtml}
            ${countdownHtml}
            <button class="${buttonClass}" onclick="${owned? `claimProfit('${ownedKey}')` : `buyMachine('${plan.id}')`}" ${buttonDisabled? "disabled" : ""}>
                ${buttonText}
            </button>
        </div>`;
    });
}

/* BUY MACHINE */
let selectedMachine = null;
window.buyMachine = (id) => {
    if(machinePlans.length === 0) { showToast("Machines still loading...", false); return; }
    selectedMachine = machinePlans.find(m => m.id === id);
    if(!selectedMachine) return;
    document.getElementById("modalTitle").textContent = selectedMachine.name;
    document.getElementById("modalText").innerHTML =
        `Investment Amount<br><b>UGX ${Number(selectedMachine.price).toLocaleString()}</b><br><br>
         Daily Profit<br><b>UGX ${Number(selectedMachine.dailyProfit).toLocaleString()}</b><br><br>
         Duration<br><b>${selectedMachine.duration} Days</b><br><br>
         <i>First payout in 24 hours</i>`;
    document.getElementById("purchaseModal").style.display = "flex";
};
window.closeModal = () => { document.getElementById("purchaseModal").style.display = "none"; };

/* INSUFFICIENT */
window.closeInsufficient = () => { document.getElementById("insufficientModal").style.display = "none"; };
window.goToDeposit = () => { window.location.href = "deposit.html"; };

/* CATEGORY FILTER */
document.querySelectorAll(".category").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        window.currentCategory = tab.dataset.category;
        renderMachines();
    });
});

/* CONFIRM PURCHASE */
window.confirmPurchase = async () => {
    if (!currentUser ||!currentUserData) { closeModal(); showToast("User not loaded.", false); return; }
    const machine = selectedMachine;
    if (!machine) { closeModal(); return; }
    const balance = Number(currentUserData.balance || 0);

    if (balance < machine.price) {
        closeModal();
        document.getElementById("insufficientText").innerHTML =
        `You need <b>UGX ${machine.price.toLocaleString()}</b> but you only have <b>UGX ${balance.toLocaleString()}</b>`;
        document.getElementById("insufficientModal").style.display = "flex";
        return;
    }

    const userMachines = currentUserData.machines || {};
    const owned = Object.values(userMachines).find(item => item.id === machine.id && item.status!== "COMPLETED");
    if (owned) { closeModal(); showToast("Machine already active.", false); return; }

    try {
        const newMachineKey = push(ref(db, `users/${currentUser.uid}/machines`)).key;
        const newActivityKey = push(ref(db, `users/${currentUser.uid}/activities`)).key;
        const startTime = Date.now();

        const updates = {};
        updates[`users/${currentUser.uid}/balance`] = balance - machine.price;
        updates[`users/${currentUser.uid}/machines/${newMachineKey}`] = {
            id: machine.id, name: machine.name, icon: machine.icon, category: machine.category,
            amount: machine.price, dailyProfit: machine.dailyProfit, duration: machine.duration,
            totalReturn: machine.totalReturn, purchasedAt: startTime, startDate: startTime,
            nextClaimAt: startTime + 86400000,
            remainingDays: machine.duration, progress: 0, totalEarned: 0, status: "RUNNING"
        };
        updates[`users/${currentUser.uid}/activities/${newActivityKey}`] = {
            icon: "fa-solid fa-microchip", title: "Purchased " + machine.name,
            amount: "-UGX " + machine.price.toLocaleString(), time: new Date().toLocaleString()
        };

        await update(ref(db), updates);
        closeModal();
        showToast("Investment activated. First payout in 24 hours.");
    } catch (error) {
        console.error(error);
        closeModal();
        showToast("Purchase failed: " + error.message, false);
    }
};

/* =========================================================
   CLAIM MACHINE PROFIT
   Writes profit to:
   1. users/{uid}/balance
   2. users/{uid}/todayProfit
   3. machine totalEarned
   4. activity history
========================================================= */

window.claimProfit = async (machineKey) => {
    if (!currentUser) {
        showToast("Please login first.", false);
        return;
    }

    try {

        /* -----------------------------------------
           GET LATEST USER DATA
        ----------------------------------------- */

        const userRef = ref(
            db,
            `users/${currentUser.uid}`
        );

        const snap = await get(userRef);

        if (!snap.exists()) {
            showToast("User data not found.", false);
            return;
        }

        const userData = snap.val();

        /* -----------------------------------------
           GET MACHINE
        ----------------------------------------- */

        const machine =
            userData.machines?.[machineKey];

        if (!machine) {
            showToast("Machine not found.", false);
            return;
        }

        if (
            String(machine.status || "")
                .toUpperCase() !== "RUNNING"
        ) {
            showToast("Machine is not active.", false);
            return;
        }

        /* -----------------------------------------
           CHECK CLAIM TIME
        ----------------------------------------- */

        const now = Date.now();

        const nextClaimAt =
            Number(machine.nextClaimAt || 0);

        if (now < nextClaimAt) {
            showToast("Not ready to claim yet.", false);
            return;
        }

        /* -----------------------------------------
           PROFIT
        ----------------------------------------- */

        const profit =
            Number(machine.dailyProfit || 0);

        if (!Number.isFinite(profit) || profit <= 0) {
            showToast("Invalid machine profit.", false);
            return;
        }

        /* -----------------------------------------
           CURRENT VALUES
        ----------------------------------------- */

        const currentBalance =
            Number(userData.balance || 0);

        const currentTodayProfit =
            Number(userData.todayProfit || 0);

        const currentTotalEarned =
            Number(machine.totalEarned || 0);

        /* -----------------------------------------
           NEXT CLAIM
        ----------------------------------------- */

        const newNextClaim =
            nextClaimAt + 86400000;

        /* -----------------------------------------
           CALCULATE REMAINING DAYS
        ----------------------------------------- */

        const startDate =
            Number(machine.startDate || now);

        const duration =
            Number(machine.duration || 0);

        const daysPassed =
            Math.floor(
                (now - startDate) / 86400000
            );

        const newRemaining =
            Math.max(
                duration - daysPassed,
                0
            );

        /* -----------------------------------------
           ACTIVITY KEY
        ----------------------------------------- */

        const activityRef =
            push(
                ref(
                    db,
                    `users/${currentUser.uid}/activities`
                )
            );

        const activityKey =
            activityRef.key;

        /* -----------------------------------------
           FIREBASE MULTI-PATH UPDATE
        ----------------------------------------- */

        const updates = {};

        /*
         * MAIN WALLET BALANCE
         */
        updates[
            `users/${currentUser.uid}/balance`
        ] =
            currentBalance + profit;

        /*
         * TODAY'S PROFIT
         *
         * THIS IS THE IMPORTANT FIELD.
         *
         * Dashboard and wallet both read:
         * users/{uid}/todayProfit
         */
        updates[
            `users/${currentUser.uid}/todayProfit`
        ] =
            currentTodayProfit + profit;

        /*
         * MACHINE TOTAL EARNED
         */
        updates[
            `users/${currentUser.uid}/machines/${machineKey}/totalEarned`
        ] =
            currentTotalEarned + profit;

        /*
         * NEXT CLAIM TIME
         */
        updates[
            `users/${currentUser.uid}/machines/${machineKey}/nextClaimAt`
        ] =
            newNextClaim;

        /*
         * REMAINING DAYS
         */
        updates[
            `users/${currentUser.uid}/machines/${machineKey}/remainingDays`
        ] =
            newRemaining;

        /*
         * COMPLETE MACHINE IF FINISHED
         */
        if (newRemaining <= 0) {

            updates[
                `users/${currentUser.uid}/machines/${machineKey}/status`
            ] = "COMPLETED";
        }

        /*
         * ACTIVITY RECORD
         */
        if (activityKey) {

            updates[
                `users/${currentUser.uid}/activities/${activityKey}`
            ] = {

                icon: "fa-solid fa-coins",

                title:
                    "Claimed from " +
                    (machine.name || "Investment Machine"),

                amount:
                    "+UGX " +
                    profit.toLocaleString(),

                time:
                    new Date().toLocaleString(),

                timestamp:
                    now
            };
        }

        /* -----------------------------------------
           DEBUG
        ----------------------------------------- */

        console.log(
            "========== MACHINE CLAIM =========="
        );

        console.log(
            "UID:",
            currentUser.uid
        );

        console.log(
            "Machine:",
            machine.name
        );

        console.log(
            "Machine Key:",
            machineKey
        );

        console.log(
            "Profit:",
            profit
        );

        console.log(
            "Previous Balance:",
            currentBalance
        );

        console.log(
            "New Balance:",
            currentBalance + profit
        );

        console.log(
            "Previous Today Profit:",
            currentTodayProfit
        );

        console.log(
            "New Today Profit:",
            currentTodayProfit + profit
        );

        console.log(
            "Balance Firebase Path:",
            `users/${currentUser.uid}/balance`
        );

        console.log(
            "Today Profit Firebase Path:",
            `users/${currentUser.uid}/todayProfit`
        );

        console.log(
            "Updates:",
            updates
        );

        console.log(
            "=================================="
        );

        /* -----------------------------------------
           WRITE ONCE
           
           IMPORTANT:
           Do NOT call update() twice.
        ----------------------------------------- */

        await update(
            ref(db),
            updates
        );

        /* -----------------------------------------
           VERIFY BALANCE
        ----------------------------------------- */

        const balanceVerify =
            await get(
                ref(
                    db,
                    `users/${currentUser.uid}/balance`
                )
            );

        /* -----------------------------------------
           VERIFY TODAY PROFIT
        ----------------------------------------- */

        const todayProfitVerify =
            await get(
                ref(
                    db,
                    `users/${currentUser.uid}/todayProfit`
                )
            );

        console.log(
            "========== CLAIM VERIFIED =========="
        );

        console.log(
            "Firebase Balance:",
            balanceVerify.val()
        );

        console.log(
            "Firebase Today Profit:",
            todayProfitVerify.val()
        );

        console.log(
            "===================================="
        );

        /* -----------------------------------------
           UPDATE LOCAL DATA
        ----------------------------------------- */

        currentUserData = {
            ...userData,

            balance:
                currentBalance + profit,

            todayProfit:
                currentTodayProfit + profit,

            machines: {
                ...(userData.machines || {}),

                [machineKey]: {
                    ...machine,

                    totalEarned:
                        currentTotalEarned + profit,

                    nextClaimAt:
                        newNextClaim,

                    remainingDays:
                        newRemaining,

                    status:
                        newRemaining <= 0
                            ? "COMPLETED"
                            : machine.status
                }
            }
        };

        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        showToast(
            `Claimed UGX ${profit.toLocaleString()} successfully`
        );

    } catch (error) {

        console.error(
            "CLAIM ERROR:",
            error
        );

        showToast(
            "Claim failed: " + error.message,
            false
        );
    }
};

/* LOADING + EMPTY */
function showLoading() {
    document.getElementById("machineList").innerHTML = `
    <div class="loading-box"><div class="loader"></div><p>Loading investment machines...</p></div>`;
}
function showEmpty() {
    document.getElementById("machineList").innerHTML = `
    <div class="empty-state">
        <i class="fa-solid fa-microchip" style="font-size:60px;color:#00D1FF;margin-bottom:20px;"></i>
        <h3>No Investment Machines</h3>
        <p>New machines will appear here automatically.</p>
    </div>`;
}
  // Block long press and right click
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchstart', e => {
  if(e.touches.length > 1) e.preventDefault(); // block pinch
});
document.addEventListener('touchend', e => {
  if(e.touches.length > 1) e.preventDefault();
});

</script>
