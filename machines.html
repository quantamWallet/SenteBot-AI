<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SenteBot | Investment Machines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
--bg:#050a14;--card:#0e1a30;--card2:#111f38;
--border:rgba(255,255,255,.06);--border2:rgba(34,211,238,.12);
--text:#f1f5f9;--muted:#8b9bb0;
--green:#34d399;--cyan:#22d3ee;--gold:#fbbf24;--red:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{background:radial-gradient(800px 400px at 50% -15%,rgba(34,211,238,.08),transparent 70%),linear-gradient(180deg,#050a14,#080f20);color:var(--text);min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.container{width:100%;max-width:500px;margin:0 auto;padding:14px 12px 0}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.back-btn{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer}
.page-title{text-align:center;flex:1}.page-title h2{font-size:18px;font-weight:800;letter-spacing:-.3px}.page-title p{font-size:10px;color:var(--muted);margin-top:3px}
.header-right{width:40px}
.balance-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#101e36,#0c172c);border-radius:18px;padding:18px;border:1px solid var(--border2);box-shadow:0 12px 30px rgba(0,0,0,.25);margin-bottom:16px}
.balance-card::before{content:"";position:absolute;width:160px;height:160px;right:-50px;top:-70px;background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);pointer-events:none}
.balance-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.balance-value{font-size:28px;font-weight:900;margin:8px 0 12px;letter-spacing:-.6px}
.balance-info{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);font-size:10px;color:var(--muted)}
.balance-info span:last-child{color:var(--cyan);font-weight:700}
.category-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.category-tabs::-webkit-scrollbar{display:none}
.category{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--border);white-space:nowrap;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s}
.category.active{background:rgba(34,211,238,.12);color:var(--cyan);border-color:var(--border2)}
.machine-list{display:flex;flex-direction:column;gap:12px}
.machine-card{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:.2s}
.machine-card:active{transform:scale(.99)}
.machine-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.machine-icon{width:50px;height:50px;flex-shrink:0;border-radius:13px;background:rgba(34,211,238,.10);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--cyan)}
.machine-name{font-size:14px;font-weight:800;letter-spacing:-.2px}
.machine-status{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 8px;border-radius:20px;font-size:8px;font-weight:800;text-transform:uppercase}
.machine-status::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.machine-status.available{background:rgba(52,211,153,.10);color:var(--green)}
.machine-status.active{background:rgba(34,211,238,.10);color:var(--cyan)}
.machine-status.completed{background:rgba(139,155,176,.10);color:var(--muted)}
.machine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.machine-grid > div{padding:10px;border-radius:10px;background:rgba(0,0,0,.18);border:1px solid var(--border);min-width:0}
.machine-grid small{display:block;color:var(--muted);font-size:8px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.machine-grid strong{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.machine-progress{margin:8px 0 12px;padding:10px;border-radius:10px;background:rgba(0,0,0,.15);border:1px solid var(--border)}
.progress-top{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-bottom:6px;font-weight:700}
.progress-top span:last-child{color:var(--cyan)}
.progress-bar{height:6px;background:#060e1e;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:20px;transition:width .5s ease}
.countdown{font-size:10px;font-weight:700;color:var(--gold);text-align:center;margin:8px 0 10px;padding:7px;border-radius:10px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.10)}
.invest-btn{width:100%;height:46px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--cyan),var(--green));color:#02120e;font-size:12px;font-weight:800;cursor:pointer;transition:.2s}
.invest-btn:active{transform:scale(.98)}
.invest-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.2)}
.claim-btn{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.modal{position:fixed;inset:0;background:rgba(2,6,14,.7);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;padding:16px;z-index:9999}
.modal-box{width:100%;max-width:360px;background:linear-gradient(160deg,#101e36,#0a1426);border:1px solid var(--border2);border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-icon{width:60px;height:60px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:26px;color:#02120e}
.modal-box h2{font-size:18px;font-weight:800;margin-bottom:8px}.modal-box p{color:var(--muted);line-height:1.6;margin-bottom:18px;font-size:12px}
.modal-buttons{display:flex;gap:10px}.modal-buttons button{flex:1;height:44px;border:none;border-radius:11px;font-weight:700;font-size:12px;cursor:pointer}
.cancel-btn{background:rgba(255,255,255,.06);color:var(--text)}.confirm-btn{background:linear-gradient(90deg,var(--cyan),var(--green));color:#02120e}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);min-width:180px;max-width:calc(100% - 40px);padding:11px 18px;border-radius:12px;background:linear-gradient(90deg,var(--cyan),var(--green));color:#02120e;font-size:11px;font-weight:800;text-align:center;display:none;opacity:0;z-index:10000;box-shadow:0 15px 40px rgba(0,0,0,.4)}
#toast.toast-visible{display:block;opacity:1;animation:pop .22s ease}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.9)}100%{transform:translate(-50%,-50%) scale(1)}}
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--muted);font-size:11px}
.loader{width:36px;height:36px;border:3px solid rgba(34,211,238,.12);border-top:3px solid var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{100%{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 16px;color:var(--muted)}.empty-state h3{color:#fff;margin-bottom:8px;font-size:16px}
.bottom-nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:500px;height:70px;background:rgba(10,20,38,.85);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:999}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:10px;color:var(--muted);cursor:pointer}
.nav-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:20px}
.nav-item.active{color:var(--cyan);font-weight:700}.nav-item.active .nav-icon{background:rgba(34,211,238,.12)}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
</style>
</head>
<body>
    <div id="purchaseModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-solid fa-microchip"></i></div>
        <h2 id="modalTitle">Purchase Machine</h2>
        <p id="modalText">Confirm your investment.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="confirm-btn" onclick="confirmPurchase()">Confirm</button>
        </div>
    </div>
</div>
<div id="insufficientModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon" style="background:linear-gradient(135deg,#f87171,#fb923c);"><i class="fa-solid fa-wallet"></i></div>
        <h2>Insufficient Balance</h2>
        <p id="insufficientText">You don't have enough balance.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeInsufficient()">Cancel</button>
            <button class="confirm-btn" onclick="goToDeposit()">Deposit Now</button>
        </div>
    </div>
</div>
<div id="toast"></div>
<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title"><h2>Investment Machines</h2><p>Trusted AI • Verified Payouts</p></div>
        <div class="header-right"></div>
    </div>
    <div class="balance-card">
        <div class="balance-label">Available Balance • Secured</div>
        <div class="balance-value" id="userBalance">UGX 0</div>
        <div class="balance-info"><span>Realtime Wallet</span><span id="machineCount">0 Active</span></div>
    </div>
    <div class="category-tabs">
        <div class="category active" data-category="All">All Machines</div>
        <div class="category" data-category="Starter">Starter</div>
        <div class="category" data-category="High Yield">High Yield</div>
    </div>
    <div id="machineList" class="machine-list"></div>
</div>
<div class="bottom-nav">
    <div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
    <div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
    <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
    <div class="nav-item" onclick="window.location='wallet.html'"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser=null, currentUserData=null, machinePlans=[];
window.currentCategory="All";
let machinePlansLoaded=false, lastHash="";
let claimCooldowns={}; // ANTI-SPAM: per machine 20 sec

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
let toastTimeout;
window.showToast=(message,success=true)=>{
    const toast=document.getElementById("toast");
    clearTimeout(toastTimeout);
    toast.textContent=message;
    toast.style.background=success?"linear-gradient(90deg,#22d3ee,#34d399)":"linear-gradient(90deg,#f87171,#fb923c)";
    toast.style.display="block"; toast.classList.remove("toast-visible"); void toast.offsetWidth; toast.classList.add("toast-visible");
    toastTimeout=setTimeout(()=>{ toast.classList.remove("toast-visible"); setTimeout(()=>toast.style.display="none",200); },2800);
};
function silentUpdate(id,val){
  const el=document.getElementById(id); if(!el) return;
  if(el.textContent!==val){ el.textContent=val; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}
onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href="index.html"; return; }
    currentUser=user;
    showLoading();
    await loadMachinePlans();
    loadUser();
});
async function loadMachinePlans(){
    const machinesRef=ref(db,"machines");
    const catalogRef=ref(db,"machinesCatalog");
    let machinesData={}, catalogData={};
    const rebuildPlans=()=>{
        const combined={};
        Object.entries(machinesData).forEach(([id,data])=>{ if(data&&data.price!=null&&data.name&&data.dailyProfit!=null){ combined[id]={id,...data}; } });
        Object.entries(catalogData).forEach(([id,data])=>{ if(data&&data.price!=null&&data.name&&data.dailyProfit!=null){ if(!combined[id]) combined[id]={id,...data}; } });
        machinePlans=Object.values(combined).sort((a,b)=>Number(a.price||0)-Number(b.price||0));
        machinePlansLoaded=true; renderMachines();
    };
    onValue(machinesRef,(snap)=>{ machinesData=snap.exists()?snap.val():{}; rebuildPlans(); });
    onValue(catalogRef,(snap)=>{ catalogData=snap.exists()?snap.val():{}; rebuildPlans(); });
}
function loadUser(){
    const userRef=ref(db,`users/${currentUser.uid}`);
    onValue(userRef,(snapshot)=>{
        if(!snapshot.exists()){ showToast("User data not found",false); return; }
        currentUserData=snapshot.val();
        const balance=Number(currentUserData.balance||0);
        const machines=currentUserData.machines?Object.values(currentUserData.machines):[];
        const activeMachines=machines.filter(m=>String(m.status||"").toUpperCase()==="RUNNING").length;
        silentUpdate("userBalance","UGX "+balance.toLocaleString());
        silentUpdate("machineCount",activeMachines+" Active");
        // silent re-render only if changed
        const hash=JSON.stringify(currentUserData.machines||{})+"_"+currentUserData.balance;
        if(hash!==lastHash){ renderMachines(); lastHash=hash; }
    });
}
function renderMachines(){
    const container=document.getElementById("machineList");
    if(!container||!machinePlansLoaded||!currentUserData) return;
    if(!Array.isArray(machinePlans)||machinePlans.length===0){ showEmpty(); return; }
    let plans=[...machinePlans];
    if(window.currentCategory!=="All"){ plans=plans.filter(m=>m.category===window.currentCategory); }
    if(plans.length===0){ showEmpty(); return; }
    const purchased=currentUserData.machines||{};
    let html="";
    plans.forEach(plan=>{
        const ownedKey=Object.keys(purchased).find(k=>{ const m=purchased[k]; return m&&m.id===plan.id&&String(m.status||"").toUpperCase()!=="COMPLETED"; });
        const owned=ownedKey?purchased[ownedKey]:null;
        let status="Available", buttonText='<i class="fa-solid fa-bolt"></i> Invest Now', buttonClass="invest-btn", buttonDisabled=false, progressHtml="", countdownHtml="";
        if(owned){
            const now=Date.now();
            const startDate=Number(owned.startDate||owned.purchasedAt||now);
            const nextClaimTime=Number(owned.nextClaimAt||(startDate+86400000));
            const timeLeft=nextClaimTime-now;
            const duration=Math.max(Number(owned.duration||plan.duration||0),0);
            const claimCount=Math.max(Number(owned.claimCount||0),0);
            const remaining=Math.max(duration-claimCount,0);
            const progress=duration>0?Math.min(Math.floor((claimCount/duration)*100),100):0;
            if(String(owned.status||"").toUpperCase()==="COMPLETED"||claimCount>=duration){
                status="COMPLETED"; buttonText='<i class="fa-solid fa-flag-checkered"></i> Completed'; buttonDisabled=true;
            } else if(timeLeft<=0){
                status="RUNNING";
                const profit=Number(owned.dailyProfit??plan.dailyProfit??0);
                buttonText='<i class="fa-solid fa-coins"></i> Claim UGX '+profit.toLocaleString();
                buttonClass="invest-btn claim-btn"; buttonDisabled=false;
            } else {
                status="RUNNING";
                const hours=Math.floor(timeLeft/3600000), mins=Math.floor((timeLeft%3600000)/60000), secs=Math.floor((timeLeft%60000)/1000);
                countdownHtml=`<div class="countdown" data-machine-key="${ownedKey}" data-next-claim="${nextClaimTime}"><i class="fa-solid fa-clock"></i> Next Claim: ${hours}h ${mins}m ${secs}s</div>`;
                buttonText='<i class="fa-solid fa-hourglass"></i> Claimed'; buttonDisabled=true;
            }
            progressHtml=`<div class="machine-progress"><div class="progress-top"><span>${remaining} Days Left</span><span>${progress}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div></div>`;
        }
        let buttonAction=owned&&ownedKey?`claimProfit('${ownedKey}')`:`buyMachine('${plan.id}')`;
        html+=`<div class="machine-card"><div class="machine-top"><div class="machine-icon"><i class="${esc(plan.icon||"fa-solid fa-microchip")}"></i></div><div><div class="machine-name">${esc(plan.name)}</div><div class="machine-status ${owned?status.toLowerCase():"available"}">${esc(status)}</div></div></div><div class="machine-grid"><div><small>Investment</small><strong>UGX ${Number(plan.price||0).toLocaleString()}</strong></div><div><small>Daily Profit</small><strong>UGX ${Number(plan.dailyProfit||0).toLocaleString()}</strong></div><div><small>Duration</small><strong>${Number(plan.duration||0)} Days</strong></div><div><small>Total Return</small><strong>UGX ${Number(plan.totalReturn||0).toLocaleString()}</strong></div></div>${progressHtml}${countdownHtml}<button class="${buttonClass}" onclick="${buttonAction}" ${buttonDisabled?"disabled":""}>${buttonText}</button></div>`;
    });
    container.innerHTML=html;
}
let selectedMachine=null;
window.buyMachine=(id)=>{
    if(machinePlans.length===0){ showToast("Machines still loading...",false); return; }
    selectedMachine=machinePlans.find(m=>m.id===id); if(!selectedMachine) return;
    document.getElementById("modalTitle").textContent=selectedMachine.name;
    document.getElementById("modalText").innerHTML=`Investment Amount<br><b>UGX ${Number(selectedMachine.price).toLocaleString()}</b><br><br>Daily Profit<br><b>UGX ${Number(selectedMachine.dailyProfit).toLocaleString()}</b><br><br>Duration<br><b>${selectedMachine.duration} Days</b><br><br><i>First payout in 24 hours</i>`;
    document.getElementById("purchaseModal").style.display="flex";
};
window.closeModal=()=>{ document.getElementById("purchaseModal").style.display="none"; };
window.closeInsufficient=()=>{ document.getElementById("insufficientModal").style.display="none"; };
window.goToDeposit=()=>{ location.href="deposit.html"; };
document.querySelectorAll(".category").forEach(tab=>{
    tab.addEventListener("click",()=>{
        document.querySelectorAll(".category").forEach(i=>i.classList.remove("active"));
        tab.classList.add("active"); window.currentCategory=tab.dataset.category; renderMachines();
    });
});
// PURCHASE - kept your atomic transaction logic
window.confirmPurchase=async()=>{
    if(!currentUser||!currentUserData){ closeModal(); showToast("Loading...",false); return; }
    const machine=selectedMachine; if(!machine){ closeModal(); return; }
    const price=Number(machine.price||0), dailyProfit=Number(machine.dailyProfit||0), duration=Number(machine.duration||0);
    if(!Number.isFinite(price)||price<=0){ closeModal(); showToast("Invalid machine",false); return; }
    const displayedBalance=Number(currentUserData.balance||0);
    if(displayedBalance<price){ closeModal(); document.getElementById("insufficientText").innerHTML=`You need <b>UGX ${price.toLocaleString()}</b> but you have <b>UGX ${displayedBalance.toLocaleString()}</b>`; document.getElementById("insufficientModal").style.display="flex"; return; }
    const userMachines=currentUserData.machines||{};
    const alreadyOwned=Object.values(userMachines).some(m=>m&&m.id===machine.id&&String(m.status||"").toUpperCase()!=="COMPLETED");
    if(alreadyOwned){ closeModal(); showToast("Machine already active",false); return; }
    const machinesRef=ref(db,`users/${currentUser.uid}/machines`);
    const activitiesRef=ref(db,`users/${currentUser.uid}/activities`);
    const newMachineKey=push(machinesRef).key, newActivityKey=push(activitiesRef).key;
    if(!newMachineKey||!newActivityKey){ closeModal(); showToast("Could not create record",false); return; }
    const startTime=Date.now();
    const balanceRef=ref(db,`users/${currentUser.uid}/balance`);
    try{
        const balanceResult=await runTransaction(balanceRef,cur=>{ const b=Number(cur||0); if(!Number.isFinite(b)) return; if(b<price) return; return b-price; });
        if(!balanceResult.committed){
            const latestSnap=await get(balanceRef); const latest=Number(latestSnap.val()||0);
            closeModal();
            if(latest<price){ document.getElementById("insufficientText").innerHTML=`You need <b>UGX ${price.toLocaleString()}</b> but you have <b>UGX ${latest.toLocaleString()}</b>`; document.getElementById("insufficientModal").style.display="flex"; }
            else showToast("Purchase could not be completed",false); return;
        }
        const updates={};
        updates[`users/${currentUser.uid}/machines/${newMachineKey}`]={id:machine.id,name:machine.name,icon:machine.icon||"fa-solid fa-microchip",category:machine.category||"Starter",amount:price,dailyProfit:duration>0?dailyProfit:0,duration:duration,totalReturn:Number(machine.totalReturn||0),purchasedAt:startTime,startDate:startTime,nextClaimAt:startTime+86400000,claimCount:0,remainingDays:duration,progress:0,totalEarned:0,status:"RUNNING"};
        updates[`users/${currentUser.uid}/activities/${newActivityKey}`]={icon:"fa-solid fa-microchip",title:"Purchased "+machine.name,amount:"-UGX "+price.toLocaleString(),time:new Date().toLocaleString(),timestamp:startTime};
        try{ await update(ref(db),updates); }catch(e){ console.error(e); try{ await runTransaction(balanceRef,cur=>{ const b=Number(cur||0); if(!Number.isFinite(b)) return; return b+price; }); }catch{} throw e; }
        closeModal(); showToast("Investment activated. First payout in 24 hours.");
    }catch(err){ console.error(err); closeModal(); showToast("Purchase failed",false); }
};
// CLAIM WITH 20 SEC ANTI-SPAM
window.claimProfit=async(machineKey)=>{
    const now=Date.now();
    if(claimCooldowns[machineKey]&&now-claimCooldowns[machineKey]<20000){
        const left=Math.ceil((20000-(now-claimCooldowns[machineKey]))/1000);
        showToast(`Please wait ${left}s before claiming again`,false); return;
    }
    claimCooldowns[machineKey]=now;
    if(!currentUser){ showToast("Please login",false); return; }
    const uid=currentUser.uid, userRef=ref(db,`users/${uid}`);
    try{
        const snap=await get(userRef); if(!snap.exists()){ showToast("User not found",false); return; }
        const data=snap.val(), machine=data.machines?.[machineKey];
        if(!machine){ showToast("Machine not found",false); return; }
        if(String(machine.status||"").toUpperCase()!=="RUNNING"){ showToast("Machine not active",false); return; }
        const nextClaimAt=Number(machine.nextClaimAt||0);
        if(Date.now()<nextClaimAt){
            const remaining=nextClaimAt-Date.now(), hours=Math.floor(remaining/3600000), minutes=Math.floor((remaining%3600000)/60000);
            showToast(`Next claim in ${hours}h ${minutes}m`,false); return;
        }
        const profit=Number(machine.dailyProfit||0); if(!Number.isFinite(profit)||profit<=0){ showToast("Invalid profit",false); return; }
        const activityKey=push(ref(db,`users/${uid}/activities`)).key;
        const result=await runTransaction(userRef,(currentData)=>{
            if(!currentData) return;
            const machines=currentData.machines||{}; const curMachine=machines[machineKey];
            if(!curMachine) return;
            if(String(curMachine.status||"").toUpperCase()!=="RUNNING") return;
            const curNext=Number(curMachine.nextClaimAt||0); if(Date.now()<curNext) return;
            const curProfit=Number(curMachine.dailyProfit||0); if(!Number.isFinite(curProfit)||curProfit<=0) return;
            const duration=Number(curMachine.duration||0); if(!Number.isFinite(duration)||duration<=0) return;
            const prev=Math.max(Number(curMachine.claimCount||0),0), newCount=prev+1, completed=newCount>=duration;
            const bal=Number(currentData.balance||0), today=Number(currentData.todayProfit||0), totalE=Number(curMachine.totalEarned||0);
            currentData.balance=bal+curProfit; currentData.todayProfit=today+curProfit;
            currentData.machines[machineKey]={...curMachine,totalEarned:totalE+curProfit,claimCount:newCount,remainingDays:Math.max(duration-newCount,0),nextClaimAt:completed?0:curNext+86400000,status:completed?"COMPLETED":"RUNNING"};
            if(activityKey){ currentData.activities=currentData.activities||{}; currentData.activities[activityKey]={icon:"fa-solid fa-coins",title:"Claimed from "+(curMachine.name||"Machine"),amount:"+UGX "+curProfit.toLocaleString(),time:new Date().toLocaleString(),timestamp:Date.now()}; }
            return currentData;
        });
        if(!result.committed){ showToast("Claim already processed",false); return; }
        currentUserData=result.snapshot.val(); renderMachines(); showToast(`Claimed UGX ${profit.toLocaleString()} successfully`);
    }catch(e){ console.error(e); showToast("Claim failed",false); }
};
function showLoading(){ document.getElementById("machineList").innerHTML=`<div class="loading-box"><div class="loader"></div><p>Loading trusted machines...</p></div>`; }
function showEmpty(){ document.getElementById("machineList").innerHTML=`<div class="empty-state"><i class="fa-solid fa-microchip" style="font-size:48px;color:#22d3ee;margin-bottom:14px;display:block"></i><h3>No Machines</h3><p>New trusted machines will appear here.</p></div>`; }
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchstart',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
