<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SenteBot | Investment Machines</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--bg:#070B14;--bg2:#101827;--card:#111827;--card2:#182235;--green:#22C55E;--green2:#16A34A;--text:#F8FAFC;--muted:#94A3B8;--border:rgba(255,255,255,.08);--shadow:0 18px 45px rgba(0,0,0,.45);}
body{background:radial-gradient(circle at top,#14302a 0%,transparent 35%),linear-gradient(180deg,#08101E,#070B14);color:var(--text);min-height:100vh;padding-bottom:120px;}
.container{max-width:520px;margin:auto;padding:18px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.back-btn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:.25s;}
.back-btn:active{transform:scale(.95);}
.page-title{text-align:center;flex:1;}
.page-title h2{font-size:20px;font-weight:800;}
.page-title p{font-size:13px;color:var(--muted);margin-top:4px;}
.header-right{width:46px;}
.balance-card{background:linear-gradient(135deg,#182235,#111827);border-radius:24px;padding:22px;border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:22px;position:relative;overflow:hidden;}
.balance-card::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(34,197,94,.10);top:-90px;right:-90px;}
.balance-label{font-size:13px;color:#CBD5E1;}
.balance-value{font-size:32px;font-weight:800;margin:10px 0;}
.balance-info{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted);}
.category-tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px;margin-bottom:24px;scrollbar-width:none;}
.category-tabs::-webkit-scrollbar{display:none;}
.category{padding:12px 18px;border-radius:30px;background:rgba(255,255,255,.05);border:1px solid var(--border);white-space:nowrap;font-size:14px;font-weight:700;cursor:pointer;transition:.25s;}
.category.active{background:var(--green);color:#07111F;border:none;}
.machine-list{display:flex;flex-direction:column;gap:18px;}
.machine-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);}
.machine-top{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.machine-icon{width:62px;height:62px;border-radius:18px;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;font-size:28px;color:#22C55E;}
.machine-name{font-size:18px;font-weight:800;}
.machine-status{margin-top:5px;display:inline-block;padding:6px 12px;border-radius:30px;font-size:12px;font-weight:700;}
.machine-status.available{background:rgba(34,197,94,.15);color:#22C55E;}
.machine-status.active{background:rgba(59,130,246,.18);color:#3B82F6;}
.machine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
.machine-grid small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;}
.machine-grid strong{font-size:15px;}
.invest-btn{width:100%;height:52px;border:none;border-radius:16px;background:linear-gradient(135deg,#22C55E,#16A34A);color:#07111F;font-size:15px;font-weight:800;cursor:pointer;transition:.25s;}
.invest-btn:active{transform:scale(.98);}
.invest-btn:disabled{opacity:.6;cursor:default;}
.modal{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;padding:20px;z-index:9999;backdrop-filter:blur(6px);}
.modal-box{width:100%;max-width:360px;background:linear-gradient(180deg,#182235,#111827);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
.modal-icon{width:72px;height:72px;margin:auto;border-radius:20px;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;font-size:34px;color:#22C55E;margin-bottom:18px;}
.modal-box h2{font-size:22px;margin-bottom:10px;}
.modal-box p{color:#94A3B8;line-height:1.6;margin-bottom:24px;}
.modal-buttons{display:flex;gap:12px;}
.modal-buttons button{flex:1;height:50px;border:none;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;}
.cancel-btn{background:#334155;color:white;}
.confirm-btn{background:#22C55E;color:#07111F;}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#22C55E;color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;font-size:14px;display:none;z-index:10000;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.machine-progress{margin-top:16px;margin-bottom:16px;}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#94A3B8;margin-bottom:8px;}
.progress-bar{height:10px;background:#1E293B;border-radius:30px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#22C55E,#16A34A);border-radius:30px;transition:.4s;}
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;}
.loader{width:45px;height:45px;border:4px solid rgba(255,255,255,.15);border-top:4px solid #22C55E;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:18px;}
@keyframes spin{100%{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:60px 20px;color:#94A3B8;}
.empty-state h3{color:#fff;margin-bottom:10px;}
.empty-state p{font-size:14px;line-height:1.6;}
.bottom-nav{
position:fixed;
left:50%;
bottom:18px;
transform:translateX(-50%);
width:calc(100% - 26px);
max-width:520px;
height:74px;
background:rgba(13,20,34,.96);
backdrop-filter:blur(20px);
border:1px solid var(--border);
border-radius:24px;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 15px 45px rgba(0,0,0,.45);
z-index:999;
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:5px;
flex:1;
font-size:11px;
color:var(--muted);
cursor:pointer;
transition:.25s;
}

.nav-icon{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
font-size:22px;
}

.nav-item.active{
color:#22C55E;
font-weight:700;
}

.nav-item.active .nav-icon{
background:rgba(34,197,94,.18);
color:#22C55E;
box-shadow:0 0 18px rgba(34,197,94,.35);
}

.nav-item:active{
transform:scale(.94);
}

</style>
</head>
<body>

<!-- PURCHASE MODAL -->
<div id="purchaseModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-solid fa-microchip"></i></div>
        <h2 id="modalTitle">Purchase Machine</h2>
        <p id="modalText">Confirm your investment.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="confirm-btn" onclick="confirmPurchase()">Confirm</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title">
            <h2>Investment Machines</h2>
            <p>Choose an AI machine to start earning</p>
        </div>
        <div class="header-right"></div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-value" id="userBalance">UGX 0</div>
        <div class="balance-info">
            <span>Realtime Wallet</span>
            <span id="machineCount">0 Active</span>
        </div>
    </div>

    <div class="category-tabs">
        <div class="category active" data-category="All">All Machines</div>
        <div class="category" data-category="Starter">Starter Machines</div>
        <div class="category" data-category="High Yield">High Yield</div>
    </div>

    <div id="machineList" class="machine-list"></div>
</div>

<div class="bottom-nav">

    <div class="nav-item active" onclick="window.location='dashboard.html'">
        <div class="nav-icon">
            <i class="fa-solid fa-house"></i>
        </div>
        <span>Home</span>
    </div>

    <div class="nav-item" onclick="window.location='team.html'">
        <div class="nav-icon">
            <i class="fa-solid fa-users"></i>
        </div>
        <span>Team</span>
    </div>

    <div class="nav-item" onclick="window.location='machines.html'">
        <div class="nav-icon">
            <i class="fa-solid fa-microchip"></i>
        </div>
        <span>Machines</span>
    </div>

    <div class="nav-item" onclick="window.location='wallet.html'">
        <div class="nav-icon">
            <i class="fa-solid fa-wallet"></i>
        </div>
        <span>Wallet</span>
    </div>

    <div class="nav-item" onclick="window.location='profile.html'">
        <div class="nav-icon">
            <i class="fa-solid fa-user"></i>
        </div>
        <span>Profile</span>
    </div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE CONFIG - add databaseURL */
const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentUserData = null;
let machinePlans = [];
window.currentCategory = "All";

/* AUTH */
onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;
    showLoading();
    await loadMachinePlans();
    loadUser();
    runMachineEngine();
    setInterval(runMachineEngine, 60000);
});

/* LOAD MACHINES FROM RTDB /machines */
async function loadMachinePlans() {
    const machinesRef = ref(db, "machines");
    onValue(machinesRef, (snapshot) => {
        machinePlans = [];
        if(snapshot.exists()){
            snapshot.forEach(child => {
                machinePlans.push({ id: child.key, ...child.val() });
            });
        }
        renderMachines(currentUserData);
    });
}

/* REALTIME USER DATA FROM /users/{uid} */
function loadUser() {
    const userRef = ref(db, "users/" + currentUser.uid);
    onValue(userRef, (snapshot) => {
        if (!snapshot.exists()) return;
        currentUserData = snapshot.val();
        const balance = Number(currentUserData.balance || 0);
        const machines = currentUserData.machines ? Object.values(currentUserData.machines) : [];
        const activeMachines = machines.filter(m => m.status === "RUNNING").length;
        document.getElementById("userBalance").textContent = "UGX " + balance.toLocaleString();
        document.getElementById("machineCount").textContent = activeMachines + " Active";
        renderMachines(currentUserData);
    });
}

/* RENDER MACHINE CARDS */
function renderMachines(data) {
    const container = document.getElementById("machineList");
    if (!container) return;

    let plans = machinePlans;
    if (window.currentCategory !== "All") {
        plans = machinePlans.filter(m => m.category === window.currentCategory);
    }
    if(plans.length === 0){ showEmpty(); return; }

    const purchased = data?.machines ? Object.values(data.machines) : [];
    container.innerHTML = "";

    plans.forEach(plan => {
        const owned = purchased.find(item => item.id === plan.id && item.status !== "COMPLETED");

        let status = "Available";
        let buttonText = '<i class="fa-solid fa-bolt"></i> Invest Now';
        let buttonStyle = "background:linear-gradient(135deg,#22C55E,#16A34A);color:#07111F;";
        let progressHtml = "";

        if (owned) {
            const elapsed = Math.floor((Date.now() - (owned.startDate || Date.now())) / 86400000);
            const remaining = Math.max((plan.duration || 0) - elapsed, 0);
            const progress = Math.min(Math.floor((elapsed / (plan.duration || 1)) * 100), 100);
            status = owned.status === "COMPLETED"? "COMPLETED" : "RUNNING";
            buttonText = owned.status === "COMPLETED"
               ? '<i class="fa-solid fa-flag-checkered"></i> Completed'
                : '<i class="fa-solid fa-coins"></i> Earning UGX ' + Number(plan.dailyProfit || 0).toLocaleString() + '/Day';
            buttonStyle = "background:#334155;color:#fff;";
            progressHtml = `
            <div class="machine-progress">
                <div class="progress-top"><span>${remaining} Days Left</span><span>${progress}%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>`;
        }

        container.innerHTML += `
        <div class="machine-card">
            <div class="machine-top">
                <div class="machine-icon"><i class="${plan.icon || 'fa-solid fa-microchip'}"></i></div>
                <div>
                    <div class="machine-name">${plan.name}</div>
                    <div class="machine-status ${owned? "active" : "available"}">${status}</div>
                </div>
            </div>
            <div class="machine-grid">
                <div><small>Investment</small><strong>UGX ${Number(plan.price || 0).toLocaleString()}</strong></div>
                <div><small>Daily Profit</small><strong>UGX ${Number(plan.dailyProfit || 0).toLocaleString()}</strong></div>
                <div><small>Duration</small><strong>${plan.duration || 0} Days</strong></div>
                <div><small>Total Return</small><strong>UGX ${Number(plan.totalReturn || plan.price * plan.duration || 0).toLocaleString()}</strong></div>
            </div>
            ${progressHtml}
            <button class="invest-btn" onclick="buyMachine('${plan.id}')" ${owned? "disabled" : ""} style="${buttonStyle}">
                ${buttonText}
            </button>
        </div>`;
    });
}

/* BUY MODAL */
let selectedMachine = null;
window.buyMachine = (id) => {
    selectedMachine = machinePlans.find(m => m.id === id);
    if(!selectedMachine) return;
    document.getElementById("modalTitle").textContent = selectedMachine.name;
    document.getElementById("modalText").innerHTML =
        `Investment Amount<br><b>UGX ${Number(selectedMachine.price).toLocaleString()}</b><br><br>
         Daily Profit<br><b>UGX ${Number(selectedMachine.dailyProfit).toLocaleString()}</b><br><br>
         Duration<br><b>${selectedMachine.duration} Days</b>`;
    document.getElementById("purchaseModal").style.display = "flex";
};
window.closeModal = () => { document.getElementById("purchaseModal").style.display = "none"; };

/* CATEGORY FILTER */
document.querySelectorAll(".category").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        window.currentCategory = tab.dataset.category;
        renderMachines(currentUserData);
    });
});

/* TOAST */
window.showToast = (message, success = true) => {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.background = success? "#22C55E" : "#EF4444";
    toast.style.display = "block";
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => { toast.style.display = "none"; }, 3000);
};

/* CONFIRM PURCHASE - RTDB VERSION */
window.confirmPurchase = async () => {
    if (!currentUser || !currentUserData) { closeModal(); showToast("User not loaded.", false); return; }
    const machine = selectedMachine;
    if (!machine) { closeModal(); return; }
    const balance = Number(currentUserData.balance || 0);
    if (balance < machine.price) { closeModal(); showToast("Insufficient wallet balance.", false); return; }
    
    const userMachines = currentUserData.machines ? Object.values(currentUserData.machines) : [];
    const owned = userMachines.find(item => item.id === machine.id && item.status !== "COMPLETED");
    if (owned) { closeModal(); showToast("Machine already active.", false); return; }

    try {
        const userRef = ref(db, "users/" + currentUser.uid);
        const newMachineKey = push(ref(db, `users/${currentUser.uid}/machines`)).key;
        const newActivityKey = push(ref(db, `users/${currentUser.uid}/activities`)).key;

        const updates = {};
        updates[`balance`] = balance - machine.price;
        updates[`machines/${newMachineKey}`] = {
            id: machine.id, name: machine.name, icon: machine.icon, category: machine.category,
            amount: machine.price, dailyProfit: machine.dailyProfit, duration: machine.duration,
            totalReturn: machine.totalReturn, purchasedAt: Date.now(), startDate: Date.now(),
            remainingDays: machine.duration, progress: 0, totalEarned: 0, lastProfitDate: "", status: "RUNNING"
        };
        updates[`activities/${newActivityKey}`] = {
            icon: "fa-solid fa-microchip", title: "Purchased " + machine.name,
            amount: "-UGX " + machine.price.toLocaleString(), time: new Date().toLocaleString()
        };
        
        await update(userRef, updates);
        closeModal();
        showToast("Investment activated successfully.");
    } catch (error) {
        console.error(error);
        closeModal();
        showToast("Purchase failed.", false);
    }
};
  /* DAILY PROFIT ENGINE FOR RTDB */
async function runMachineEngine(){
    if(!currentUser) return;
    const userRef = ref(db,"users/" + currentUser.uid);
    const snap = await get(userRef);
    if(!snap.exists()) return;
    const data = snap.val();
    const machines = data.machines || {};
    let profit = 0; let changed = false;
    const today = new Date().toISOString().split("T")[0];
    const updates = {};

    Object.keys(machines).forEach(key => {
        const machine = machines[key];
        if(machine.status !== "RUNNING") return;
        const daysPassed = Math.floor((Date.now() - machine.startDate) / 86400000);
        machine.remainingDays = Math.max(machine.duration - daysPassed, 0);
        machine.progress = Math.min(Math.floor((daysPassed / machine.duration) * 100), 100);

        if(machine.remainingDays <= 0){
            machine.status = "COMPLETED";
            changed = true;
        }
        if(machine.lastProfitDate !== today && machine.status === "RUNNING"){
            profit += Number(machine.dailyProfit || 0);
            machine.totalEarned = Number(machine.totalEarned || 0) + Number(machine.dailyProfit || 0);
            machine.lastProfitDate = today;
            changed = true;
        }
        updates[`machines/${key}`] = machine;
    });

    if(!changed) return;
    updates[`balance`] = Number(data.balance || 0) + profit;
    updates[`todayProfit`] = Number(data.todayProfit || 0) + profit;
    await update(userRef, updates);
}

/* LOADING + EMPTY */
function showLoading() {
    document.getElementById("machineList").innerHTML = `
    <div class="loading-box"><div class="loader"></div><p>Loading investment machines...</p></div>`;
}
function showEmpty() {
    document.getElementById("machineList").innerHTML = `
    <div class="empty-state">
        <i class="fa-solid fa-microchip" style="font-size:60px;color:#22C55E;margin-bottom:20px;"></i>
        <h3>No Investment Machines</h3>
        <p>New machines will appear here automatically.</p>
    </div>`;
}
</script>
</body>
</html>
