<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SenteBot | Investment Machines</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#050A18;--card:#0E1629;--card2:#14243E;--green:#00E676;--cyan:#00D1FF;--gold:#FFD166;
  --text:#F8FAFC;--muted:#94A3B8;--border:rgba(0,209,255,.15);
  --glow-cyan:0 0 25px rgba(0,209,255,.25);
  --glow-green:0 0 25px rgba(0,230,118,.25);
}
body{
  background:radial-gradient(1200px 600px at 50% -20%,rgba(0,209,255,.12),transparent 60%),
             linear-gradient(180deg,#050A18,#070B14);
  color:var(--text);min-height:100vh;padding-bottom:120px;
}
.container{max-width:540px;margin:auto;padding:18px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  /* BLOCK CHROME TAP TO SEARCH + LONG PRESS */
*{
  -webkit-touch-callout: none; /* iOS long press menu */
  -webkit-user-select: none;   /* Safari */
   -khtml-user-select: none;   /* Konqueror */
     -moz-user-select: none;   /* Firefox */
      -ms-user-select: none;   /* IE/Edge */
          user-select: none;   /* Standard */
}

/* Allow selection only in inputs */
input, textarea{
  -webkit-user-select: text;
     -moz-user-select: text;
      -ms-user-select: text;
          user-select: text;
}
  
.back-btn{
  width:46px;height:46px;border-radius:15px;background:rgba(0,209,255,.06);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:18px;cursor:pointer;transition:.3s;backdrop-filter:blur(10px);
}
.back-btn:hover{box-shadow:var(--glow-cyan);border-color:var(--cyan);}
.page-title{text-align:center;flex:1;}
.page-title h2{font-size:22px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-title p{font-size:13px;color:var(--muted);margin-top:4px;}
.header-right{width:46px;}
.balance-card{
  background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));
  border-radius:24px;padding:24px;border:1px solid var(--border);
  box-shadow:var(--glow-cyan);margin-bottom:24px;position:relative;overflow:hidden;backdrop-filter:blur(16px);
}
.balance-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.balance-value{font-size:34px;font-weight:800;margin:10px 0;background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.balance-info{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted);}
.category-tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px;margin-bottom:24px;scrollbar-width:none;}
.category-tabs::-webkit-scrollbar{display:none;}
.category{
  padding:11px 18px;border-radius:30px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);white-space:nowrap;font-size:14px;font-weight:700;cursor:pointer;transition:.3s;
}
.category.active{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;border:none;box-shadow:var(--glow-cyan);}
.machine-list{display:flex;flex-direction:column;gap:18px;}
.machine-card{
  background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));
  border:1px solid var(--border);border-radius:22px;padding:20px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);backdrop-filter:blur(16px);position:relative;transition:.3s;
}
.machine-card:hover{transform:translateY(-3px);box-shadow:var(--glow-cyan);}
.machine-top{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.machine-icon{
  width:62px;height:62px;border-radius:18px;
  background:linear-gradient(135deg,rgba(0,209,255,.2),rgba(0,230,118,.2));
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--cyan);
  border:1px solid var(--border);
}
.machine-name{font-size:18px;font-weight:800;}
.machine-status{margin-top:5px;display:inline-block;padding:6px 12px;border-radius:30px;font-size:12px;font-weight:700;}
.machine-status.available{background:rgba(0,230,118,.15);color:var(--green);}
.machine-status.active{background:rgba(0,209,255,.18);color:var(--cyan);}
.machine-status.completed{background:rgba(148,163,184,.18);color:var(--muted);}
.machine-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px;}
.machine-grid small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px;}
.machine-grid strong{font-size:15px;}
.invest-btn{
  width:100%;height:52px;border:none;border-radius:16px;
  background:linear-gradient(90deg,var(--cyan),var(--green));
  color:#05121A;font-size:15px;font-weight:800;cursor:pointer;transition:.25s;
}
.invest-btn:hover:not(:disabled){filter:brightness(1.1);transform:scale(1.01);}
.invest-btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(1);}
.claim-btn{background:linear-gradient(90deg,var(--gold),#F59E0B);}
.modal{position:fixed;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;padding:20px;z-index:9999;backdrop-filter:blur(10px);}
.modal-box{
  width:100%;max-width:380px;background:linear-gradient(180deg,#0E1629,#0B1324);
  border:1px solid var(--border);border-radius:24px;padding:28px;text-align:center;
  box-shadow:0 20px 60px rgba(0,209,255,.25);
}
.modal-icon{width:72px;height:72px;margin:auto;border-radius:20px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:34px;color:#05121A;margin-bottom:18px;}
.modal-box h2{font-size:22px;margin-bottom:10px;}
.modal-box p{color:#94A3B8;line-height:1.6;margin-bottom:24px;}
.modal-buttons{display:flex;gap:12px;}
.modal-buttons button{flex:1;height:50px;border:none;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s;}
.cancel-btn{background:#1E293B;color:white;}
.cancel-btn:hover{background:#334155;}
.confirm-btn{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;}
.confirm-btn:hover{filter:brightness(1.1);}

/* CENTERED TOAST */
#toast{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;
  padding:16px 28px;border-radius:16px;font-weight:800;font-size:15px;display:none;z-index:10000;
  box-shadow:0 20px 60px rgba(0,209,255,.4);text-align:center;min-width:280px;
  animation:pop.3s ease;
}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.9);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}

.machine-progress{margin-top:16px;margin-bottom:16px;}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:#94A3B8;margin-bottom:8px;}
.progress-bar{height:10px;background:#0B1324;border-radius:30px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:30px;transition:.4s;box-shadow:0 0 10px rgba(0,209,255,.4);}
.countdown{font-size:13px;font-weight:700;color:var(--gold);text-align:center;margin-top:10px;}
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;}
.loader{width:45px;height:45px;border:4px solid rgba(0,209,255,.2);border-top:4px solid var(--cyan);border-radius:50%;animation:spin.8s linear infinite;margin-bottom:18px;}
@keyframes spin{100%{transform:rotate(360deg);}}
.empty-state{text-align:center;padding:60px 20px;color:#94A3B8;}
.empty-state h3{color:#fff;margin-bottom:10px;}
.empty-state p{font-size:14px;line-height:1.6;}
.bottom-nav{
position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:540px;height:74px;
background:rgba(8,16,32,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;
display:flex;justify-content:space-around;align-items:center;box-shadow:0 15px 45px rgba(0,0,0,.45);z-index:999;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;transition:.25s;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;transition:.2s;}
.nav-item.active{color:var(--cyan);font-weight:700;}
.nav-item.active .nav-icon{
    background:rgba(0,209,255,.15);
    color:var(--cyan);
    box-shadow:0 0 18px rgba(0,209,255,.35);
}
</style>
</head>
  <meta name="google" content="notranslate">
<body>

<!-- PURCHASE MODAL -->
<div id="purchaseModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon"><i class="fa-solid fa-microchip"></i></div>
        <h2 id="modalTitle">Purchase Machine</h2>
        <p id="modalText">Confirm your investment.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            <button class="confirm-btn" onclick="confirmPurchase()">Confirm</button>
        </div>
    </div>
</div>

<!-- INSUFFICIENT BALANCE MODAL -->
<div id="insufficientModal" class="modal">
    <div class="modal-box">
        <div class="modal-icon" style="background:linear-gradient(135deg,#EF4444,#F97316);"><i class="fa-solid fa-wallet"></i></div>
        <h2>Insufficient Balance</h2>
        <p id="insufficientText">You don't have enough balance.</p>
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="closeInsufficient()">Cancel</button>
            <button class="confirm-btn" onclick="goToDeposit()">Deposit Now</button>
        </div>
    </div>
</div>

<!-- TOAST CENTERED -->
<div id="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title">
            <h2>Investment Machines</h2>
            <p>Choose an AI machine to start earning</p>
        </div>
        <div class="header-right"></div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-value" id="userBalance">UGX 0</div>
        <div class="balance-info">
            <span>Realtime Wallet</span>
            <span id="machineCount">0 Active</span>
        </div>
    </div>

    <div class="category-tabs">
        <div class="category active" data-category="All">All Machines</div>
        <div class="category" data-category="Starter">Starter Machines</div>
        <div class="category" data-category="High Yield">High Yield Machines</div>
    </div>

    <div id="machineList" class="machine-list"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
    <div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
    <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
    <div class="nav-item" onclick="window.location='wallet.html'"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
    <div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let currentUserData = null;
let machinePlans = [];
window.currentCategory = "All";

/* CENTERED TOAST */
let toastTimeout;
window.showToast = (message, success = true) => {
    const toast = document.getElementById("toast");
    clearTimeout(toastTimeout);
    toast.textContent = message;
    toast.style.background = success? "linear-gradient(90deg,#00D1FF,#00E676)" : "#EF4444";
    toast.style.display = "block";
    toastTimeout = setTimeout(() => { toast.style.display = "none"; }, 3000);
};

/* AUTH */
onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;
    showLoading();
    await loadMachinePlans();
    loadUser();
    let timer;

if (!timer) {
    timer = setInterval(renderMachines, 1000);
}
});

/* LOAD MACHINES - FIXED: reads from both machines + machinesCatalog */
async function loadMachinePlans() {
    const machinesRef = ref(db, "machines");
    const catalogRef = ref(db, "machinesCatalog"); // ADD THIS

    onValue(machinesRef, (snapshot) => {
        machinePlans = [];
        if(snapshot.exists()){
            snapshot.forEach(child => {
                const data = child.val();
                // Only add if it has required fields
                if(data.price && data.name && data.dailyProfit) {
                    machinePlans.push({ id: child.key,...data });
                }
            });
        }
        loadCatalog(); // load catalog too
    });

    function loadCatalog(){
        onValue(catalogRef, (snapshot) => {
            if(snapshot.exists()){
                snapshot.forEach(child => {
                    const data = child.val();
                    if(data.price && data.name && data.dailyProfit) {
                        // avoid duplicates
                        if(!machinePlans.find(m => m.id === child.key)){
                            machinePlans.push({ id: child.key,...data });
                        }
                    }
                });
            }
            machinePlans.sort((a,b) => Number(a.price) - Number(b.price));
            renderMachines();
        });
    }
}

/* LOAD USER */
function loadUser() {
    const userRef = ref(db, "users/" + currentUser.uid);
    onValue(userRef, (snapshot) => {
        if (!snapshot.exists()) return;
        currentUserData = snapshot.val();
        const balance = Number(currentUserData.balance || 0);
        const machines = currentUserData.machines? Object.values(currentUserData.machines) : [];
        const activeMachines = machines.filter(m => m.status === "RUNNING").length;
        document.getElementById("userBalance").textContent = "UGX " + balance.toLocaleString();
        document.getElementById("machineCount").textContent = activeMachines + " Active";
        renderMachines();
    });
}

/* RENDER MACHINES WITH COUNTDOWN + CLAIM */
function renderMachines() {
    const container = document.getElementById("machineList");
    if (!container) return;
    if(machinePlans.length === 0){ showLoading();
                     showEmpty();             
                    return; }

    let plans = [...machinePlans];
    if (window.currentCategory!== "All") plans = plans.filter(m => m.category === window.currentCategory);
    if(plans.length === 0){ showEmpty(); return; }

    const purchased = currentUserData?.machines || {};
    container.innerHTML = "";

    plans.forEach(plan => {
        const ownedKey = Object.keys(purchased).find(k => purchased[k].id === plan.id && purchased[k].status!== "COMPLETED");
        const owned = ownedKey? purchased[ownedKey] : null;

        let status = "Available";
        let buttonText = '<i class="fa-solid fa-bolt"></i> Invest Now';
        let buttonClass = "invest-btn";
        let buttonDisabled = false;
        let progressHtml = "";
        let countdownHtml = "";

        if (owned) {
            const now = Date.now();
            const nextClaimTime = owned.nextClaimAt || (owned.startDate + 86400000);
            const timeLeft = nextClaimTime - now;
            const elapsed = Math.floor((now - owned.startDate) / 86400000);
            const remaining = Math.max(plan.duration - elapsed, 0);
            const progress = Math.min(Math.floor((elapsed / plan.duration) * 100), 100);

            if(owned.status === "COMPLETED"){
                status = "COMPLETED";
                buttonText = '<i class="fa-solid fa-flag-checkered"></i> Completed';
                buttonDisabled = true;
            } else if(timeLeft <= 0){
                status = "RUNNING";
                buttonText = '<i class="fa-solid fa-coins"></i> Claim UGX ' + Number(plan.dailyProfit).toLocaleString();
                buttonClass = "invest-btn claim-btn";
                buttonDisabled = false;
            } else {
                status = "RUNNING";
                const hours = Math.floor(timeLeft / 3600000);
                const mins = Math.floor((timeLeft % 3600000) / 60000);
                const secs = Math.floor((timeLeft % 60000) / 1000);
                countdownHtml = `<div class="countdown"><i class="fa-solid fa-clock"></i> Next Claim: ${hours}h ${mins}m ${secs}s</div>`;
                buttonText = '<i class="fa-solid fa-hourglass"></i> Claimed';
                buttonDisabled = true;
            }
            progressHtml = `
            <div class="machine-progress">
                <div class="progress-top"><span>${remaining} Days Left</span><span>${progress}%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
            </div>`;
        }

        container.innerHTML += `
        <div class="machine-card">
            <div class="machine-top">
                <div class="machine-icon"><i class="${plan.icon || 'fa-solid fa-microchip'}"></i></div>
                <div>
                    <div class="machine-name">${plan.name}</div>
                    <div class="machine-status ${owned? status.toLowerCase() : "available"}">${status}</div>
                </div>
            </div>
            <div class="machine-grid">
                <div><small>Investment</small><strong>UGX ${Number(plan.price).toLocaleString()}</strong></div>
                <div><small>Daily Profit</small><strong>UGX ${Number(plan.dailyProfit).toLocaleString()}</strong></div>
                <div><small>Duration</small><strong>${plan.duration} Days</strong></div>
                <div><small>Total Return</small><strong>UGX ${Number(plan.totalReturn).toLocaleString()}</strong></div>
            </div>
            ${progressHtml}
            ${countdownHtml}
            <button class="${buttonClass}" onclick="${owned? `claimProfit('${ownedKey}')` : `buyMachine('${plan.id}')`}" ${buttonDisabled? "disabled" : ""}>
                ${buttonText}
            </button>
        </div>`;
    });
}

/* BUY MACHINE */
let selectedMachine = null;
window.buyMachine = (id) => {
    if(machinePlans.length === 0) { showToast("Machines still loading...", false); return; }
    selectedMachine = machinePlans.find(m => m.id === id);
    if(!selectedMachine) return;
    document.getElementById("modalTitle").textContent = selectedMachine.name;
    document.getElementById("modalText").innerHTML =
        `Investment Amount<br><b>UGX ${Number(selectedMachine.price).toLocaleString()}</b><br><br>
         Daily Profit<br><b>UGX ${Number(selectedMachine.dailyProfit).toLocaleString()}</b><br><br>
         Duration<br><b>${selectedMachine.duration} Days</b><br><br>
         <i>First payout in 24 hours</i>`;
    document.getElementById("purchaseModal").style.display = "flex";
};
window.closeModal = () => { document.getElementById("purchaseModal").style.display = "none"; };

/* INSUFFICIENT */
window.closeInsufficient = () => { document.getElementById("insufficientModal").style.display = "none"; };
window.goToDeposit = () => { window.location.href = "deposit.html"; };

/* CATEGORY FILTER */
document.querySelectorAll(".category").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
        tab.classList.add("active");
        window.currentCategory = tab.dataset.category;
        renderMachines();
    });
});

/* CONFIRM PURCHASE */
window.confirmPurchase = async () => {
    if (!currentUser ||!currentUserData) { closeModal(); showToast("User not loaded.", false); return; }
    const machine = selectedMachine;
    if (!machine) { closeModal(); return; }
    const balance = Number(currentUserData.balance || 0);

    if (balance < machine.price) {
        closeModal();
        document.getElementById("insufficientText").innerHTML =
        `You need <b>UGX ${machine.price.toLocaleString()}</b> but you only have <b>UGX ${balance.toLocaleString()}</b>`;
        document.getElementById("insufficientModal").style.display = "flex";
        return;
    }

    const userMachines = currentUserData.machines || {};
    const owned = Object.values(userMachines).find(item => item.id === machine.id && item.status!== "COMPLETED");
    if (owned) { closeModal(); showToast("Machine already active.", false); return; }

    try {
        const newMachineKey = push(ref(db, `users/${currentUser.uid}/machines`)).key;
        const newActivityKey = push(ref(db, `users/${currentUser.uid}/activities`)).key;
        const startTime = Date.now();

        const updates = {};
        updates[`users/${currentUser.uid}/balance`] = balance - machine.price;
        updates[`users/${currentUser.uid}/machines/${newMachineKey}`] = {
            id: machine.id, name: machine.name, icon: machine.icon, category: machine.category,
            amount: machine.price, dailyProfit: machine.dailyProfit, duration: machine.duration,
            totalReturn: machine.totalReturn, purchasedAt: startTime, startDate: startTime,
            nextClaimAt: startTime + 86400000,
            remainingDays: machine.duration, progress: 0, totalEarned: 0, status: "RUNNING"
        };
        updates[`users/${currentUser.uid}/activities/${newActivityKey}`] = {
            icon: "fa-solid fa-microchip", title: "Purchased " + machine.name,
            amount: "-UGX " + machine.price.toLocaleString(), time: new Date().toLocaleString()
        };

        await update(ref(db), updates);
        closeModal();
        showToast("Investment activated. First payout in 24 hours.");
    } catch (error) {
        console.error(error);
        closeModal();
        showToast("Purchase failed: " + error.message, false);
    }
};

/* CLAIM PROFIT */
window.claimProfit = async (machineKey) => {
    if (!currentUser) return;

    try {
        // Get the latest user data directly from Firebase
        const userRef = ref(db, `users/${currentUser.uid}`);
        const snap = await get(userRef);

        if (!snap.exists()) {
            showToast("User data not found.", false);
            return;
        }

        const userData = snap.val();
        const machine = userData.machines?.[machineKey];

        if (!machine || machine.status !== "RUNNING") {
            showToast("Machine is not active.", false);
            return;
        }

        const now = Date.now();

        if (now < Number(machine.nextClaimAt || 0)) {
            showToast("Not ready to claim yet", false);
            return;
        }

        const profit = Number(machine.dailyProfit || 0);

        const newNextClaim =
            Number(machine.nextClaimAt) + 86400000;

        const daysPassed = Math.floor(
            (now - Number(machine.startDate)) / 86400000
        );

        const newRemaining = Math.max(
            Number(machine.duration) - daysPassed,
            0
        );

        const activityKey = push(
            ref(db, `users/${currentUser.uid}/activities`)
        ).key;

        const currentBalance =
            Number(userData.balance || 0);

        const currentTodayProfit =
            Number(userData.todayProfit || 0);

        const currentTotalEarned =
            Number(machine.totalEarned || 0);

        const updates = {};

        // Wallet balance
        updates[`users/${currentUser.uid}/balance`] =
            currentBalance + profit;

        // TODAY'S EARNINGS
        updates[`users/${currentUser.uid}/todayProfit`] =
            currentTodayProfit + profit;

        // Machine total earnings
        updates[`users/${currentUser.uid}/machines/${machineKey}/totalEarned`] =
            currentTotalEarned + profit;

        // Next claim
        updates[`users/${currentUser.uid}/machines/${machineKey}/nextClaimAt`] =
            newNextClaim;

        // Remaining days
        updates[`users/${currentUser.uid}/machines/${machineKey}/remainingDays`] =
            newRemaining;

        // Complete machine
        if (newRemaining <= 0) {
            updates[`users/${currentUser.uid}/machines/${machineKey}/status`] =
                "COMPLETED";
        }

        // Activity
        updates[`users/${currentUser.uid}/activities/${activityKey}`] = {
            icon: "fa-solid fa-coins",
            title: "Claimed from " + machine.name,
            amount: "+UGX " + profit.toLocaleString(),
            time: new Date().toLocaleString()
        };

      console.log("========== MACHINE CLAIM ==========");
console.log("UID:", currentUser.uid);
console.log("Machine:", machine.name);
console.log("Machine profit:", profit);
console.log("Previous todayProfit:", currentTodayProfit);
console.log("New todayProfit:", currentTodayProfit + profit);
console.log(
    "Firebase path:",
    `users/${currentUser.uid}/todayProfit`
);
console.log("Updates being written:", updates);
console.log("==================================");

await update(ref(db), updates);
        await update(ref(db), updates);

        // Update local data too
        currentUserData = {
            ...userData,
            balance: currentBalance + profit,
            todayProfit: currentTodayProfit + profit
        };

      const verifySnap = await get(
    ref(db, `users/${currentUser.uid}/todayProfit`)
);

console.log(
    "VERIFY Firebase todayProfit AFTER CLAIM:",
    verifySnap.val()
);
      
        showToast(
            `Claimed UGX ${profit.toLocaleString()} successfully`
        );

    } catch (error) {
        console.error("CLAIM ERROR:", error);
        showToast("Claim failed: " + error.message, false);
    }
};
