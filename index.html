<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SenteBot - AI Investment Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0B1220; --bg2: #111827; --card: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12); --green: #22C55E; --green-dark: #16A34A;
      --text: #E5E7EB; --muted: #9CA3AF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background: radial-gradient(1200px 600px at 20% -10%, #22C55E22, transparent),
                  radial-gradient(1000px 500px at 110% 10%, #3B82F622, transparent),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; color: var(--text);
    }
    .wrap { width: 100%; max-width: 440px; }
    .brand { text-align: center; margin-bottom: 20px; }
    .brand 
    .logo{
    width:70px;
    height:70px;
    border-radius:20px;
    background:linear-gradient(135deg,#22C55E,#16A34A);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(34,197,94,.35);
}

.logo img{
    width:56px;
    height:56px;
    object-fit:contain;
}
    .brand h1 { font-size: 26px; font-weight: 700; }
    .brand p { color: var(--muted); font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(16px); border-radius: 20px; padding: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .tabs { display: flex; gap: 6px; padding: 6px; background: rgba(0,0,0,0.2); border-radius: 14px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; border-radius: 10px; background: transparent; border: none; color: var(--muted); font-weight: 600; cursor: pointer; transition: .2s; }
    .tab.active { background: #fff; color: #111827; }
    .form { display: none; }
    .form.active { display: block; padding: 0 16px 16px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    .input-wrap { display: flex; align-items: center; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; }
    .input-wrap .prefix { color: var(--muted); font-weight: 600; padding-right: 8px; border-right: 1px solid var(--border); margin-right: 8px; }
    .input-wrap input { width: 100%; padding: 14px 6px; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; }
    .input-wrap:focus-within { border-color: var(--green); }
    .btn { width: 100%; padding: 14px; margin-top: 8px; background: var(--green); color: #051b0a; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: .2s; }
    .btn:hover { background: var(--green-dark); transform: translateY(-1px); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .message { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: none; }
    .message.success { background: #22C55E1A; color: var(--green); border: 1px solid #22C55E33; }
    .message.error { background: #EF44441A; color: #F87171; border: 1px solid #EF444433; }
    .footer-note { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
    .input-wrap{
    display:flex;
    align-items:center;
}

.input-wrap i{
    color:#94A3B8;
    cursor:pointer;
    font-size:18px;
    padding-left:10px;
}

.input-wrap i:hover{
    color:#22C55E;
}

  </style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <div class="wrap">
    <div class="brand">
     <div class="logo">
    <img src="1785941872628.jpg"
</div>
      <h1>SenteBot-AI</h1>
      <p>AI-Powered Investment Platform</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-form="login">Login</button>
        <button class="tab" data-form="register">Create Account</button>
      </div>

      <!-- LOGIN -->
      <form id="loginForm" class="form active">
        <div class="input-group">
          <label>Phone Number</label>
          <div class="input-wrap">
            <span class="prefix">+256</span>
            <input type="tel" id="loginPhone" placeholder="7XXXXXXXX" maxlength="9" pattern="[0-9]{9}" required />
          </div>
        </div>
        <div class="input-group">
  <label>Password</label>
  <div class="input-wrap">
    <input type="password" id="loginPassword" placeholder="Enter your password" required>
    <i class="fa-solid fa-eye" id="toggleLoginPassword"></i>
  </div>
  </div>
        <button type="submit" class="btn" id="loginBtn">Login to Dashboard</button>
        <div id="loginMessage" class="message"></div>
      </form>

      <!-- REGISTER -->
      <form id="registerForm" class="form">
        <div class="input-group">
          <label>Username</label>
          <div class="input-wrap">
            <input type="text" id="registerUsername" placeholder="sentebot_user" minlength="3" required />
          </div>
        </div>
        <div class="input-group">
          <label>Phone Number</label>
          <div class="input-wrap">
            <span class="prefix">+256</span>
            <input type="tel" id="registerPhone" placeholder="7XXXXXXXX" maxlength="9" pattern="[0-9]{9}" required />
          </div>
        </div>
        <div class="input-group">
  <label>Password</label>
  <div class="input-wrap">
    <input type="password" id="registerPassword" minlength="6" placeholder="Min 6 characters" required />
    <i class="fa-solid fa-eye" id="toggleRegisterPassword"></i>
  </div>
</div>

<div class="input-group">
  <label>Confirm Password</label>
  <div class="input-wrap">
    <input type="password" id="registerConfirmPassword" placeholder="Re-enter password" required />
    <i class="fa-solid fa-eye" id="toggleRegisterConfirm"></i>
  </div>
</div>

<div class="input-group">
  <label>Referral Code - Optional</label>
  <div class="input-wrap">
    <input type="text" id="referralInput" placeholder="SB7K9P2" style="text-transform:uppercase" />
  </div>
</div>
        <button type="submit" class="btn" id="registerBtn">Create SenteBot Account</button>
        <div id="registerMessage" class="message"></div>
      </form>
      <p class="footer-note">By joining you agree to SenteBot Terms & Risk Disclosure</p>
    </div>
  </div>

 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getDatabase,
ref,
set,
get,
update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const PHONE_SUFFIX="@sentebot.app";



onAuthStateChanged(auth,(user)=>{
 if(user){
   window.location.href="dashboard.html";
 }
});



function showMessage(el,text,type){

 el.textContent=text;
 el.className="message "+type;
 el.style.display="block";

 setTimeout(()=>{
  el.style.display="none";
 },5000);

}



function setLoading(btn,state){

 btn.disabled=state;

 btn.textContent =
 state ? "Please wait..." : btn.dataset.text;

}



function formatPhone(phone){
 return "+256"+phone;
}


function phoneToEmail(phone){
 return formatPhone(phone)+PHONE_SUFFIX;
}


function generateRefCode(){

 return "SB"+Math.random()
 .toString(36)
 .substring(2,8)
 .toUpperCase();

}



document.querySelectorAll(".btn")
.forEach(btn=>{
 btn.dataset.text=btn.textContent;
});



// PASSWORD TOGGLE

[
["toggleLoginPassword","loginPassword"],
["toggleRegisterPassword","registerPassword"],
["toggleRegisterConfirm","registerConfirmPassword"]

].forEach(item=>{

 const icon=document.getElementById(item[0]);
 const input=document.getElementById(item[1]);

 if(icon && input){

 icon.onclick=()=>{

 input.type =
 input.type==="password"
 ?"text"
 :"password";

 icon.classList.toggle("fa-eye-slash");

 };

 }

});



// TABS

document.querySelectorAll(".tab")
.forEach(btn=>{

btn.onclick=(e)=>{

const form=e.target.dataset.form;

document.querySelectorAll(".form")
.forEach(f=>f.classList.remove("active"));

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document.getElementById(form+"Form")
.classList.add("active");

e.target.classList.add("active");

};

});




// REGISTER


document.getElementById("registerForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();


const btn=document.getElementById("registerBtn");
setLoading(btn,true);


const username =
document.getElementById("registerUsername")
.value.trim();


const phone =
document.getElementById("registerPhone")
.value.trim();


const password =
document.getElementById("registerPassword")
.value;


const confirmPassword =
document.getElementById("registerConfirmPassword")
.value;


const referralInput =
document.getElementById("referralInput")
.value.trim()
.toUpperCase();


const msg =
document.getElementById("registerMessage");



try{


if(!/^[0-9]{9}$/.test(phone))
throw Error("Enter valid phone number");


if(password!==confirmPassword)
throw Error("Passwords do not match");


if(password.length<6)
throw Error("Password minimum is 6 characters");



const fullPhone=formatPhone(phone);
const email=phoneToEmail(phone);



/*
 CHECK PHONE
*/

const phoneCheck=
await get(ref(db,"phones/"+fullPhone));


if(phoneCheck.exists())
throw Error("Phone already registered");



/*
 CHECK REFERRAL
*/


let referrerUid="";


if(referralInput!==""){


const refSnap=
await get(ref(db,"referralCodes/"+referralInput));


if(!refSnap.exists())
throw Error("Invalid referral code");


referrerUid=refSnap.val().uid;


}




/*
 CREATE ACCOUNT
*/


const credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);


const user=credential.user;



await updateProfile(user,{
displayName:username
});



const myReferralCode=
generateRefCode();





/*
 SAVE USER
*/


await set(
ref(db,"users/"+user.uid),
{

username,

phone:fullPhone,

email,

balance:0,

todayProfit:0,

referralEarnings:0,

totalEarnings:0,

checkinDays:0,

activeMachines:0,

teamCount:0,

machines:{},

activities:{},

createdAt:Date.now(),

status:"active",

referrer:referrerUid,

referralCode:myReferralCode,

referralClaimed:false,

lastActive:Date.now()

}

);





/*
 SAVE PHONE LOCK
*/


await set(
ref(db,"phones/"+fullPhone),
{
uid:user.uid
}

);





/*
 SAVE REFERRAL LOOKUP
*/


await set(
ref(db,"referralCodes/"+myReferralCode),
{

uid:user.uid,

username,

createdAt:Date.now()

}

);





/*
 UPDATE REFERRER TEAM COUNT
*/


if(referrerUid){


const refUser=
ref(db,"users/"+referrerUid);


const snap=
await get(refUser);


const old =
snap.val()?.teamCount || 0;


await update(
refUser,
{
teamCount:Number(old)+1
}
);


}




showMessage(
msg,
"Account created successfully!",
"success"
);


document.getElementById("registerForm")
.reset();


setTimeout(()=>{

document.querySelector(
'.tab[data-form="login"]'
).click();

},1000);



}

catch(error){

console.error(error);

showMessage(
msg,
error.message,
"error"
);

}

finally{

setLoading(btn,false);

}


});







// LOGIN


document.getElementById("loginForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();


const btn=
document.getElementById("loginBtn");


setLoading(btn,true);



const phone=
document.getElementById("loginPhone")
.value.trim();


const password=
document.getElementById("loginPassword")
.value;



const msg=
document.getElementById("loginMessage");



try{


if(!/^[0-9]{9}$/.test(phone))
throw Error("Invalid phone");


await signInWithEmailAndPassword(
auth,
phoneToEmail(phone),
password
);



showMessage(
msg,
"Login successful!",
"success"
);



setTimeout(()=>{

window.location.href="dashboard.html";

},1000);



}

catch(error){

showMessage(
msg,
"Invalid phone or password",
"error"
);

}

finally{

setLoading(btn,false);

}


});



  </script>
</body>
</html>
