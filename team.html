<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SenteBot-AI | Team</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --card:#0E1629;
  --card2:#14243E;
  --border:rgba(0,209,255,.15);
  --text:#F8FAFC;
  --muted:#94A3B8;
  --green:#00E676;
  --cyan:#00D1FF;
  --green-dark:#16A34A;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
body{
  background:radial-gradient(1200px 600px at 50% -20%,rgba(0,209,255,.12),transparent 60%),linear-gradient(180deg,#050A18,#070B14);
  min-height:100vh;color:var(--text);
  overflow-x:hidden;
  padding-bottom:110px;
}
.container{
  max-width:540px;
  margin:auto;
  padding:14px;
}
.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}
.back-btn{
  width:40px;height:40px;border-radius:12px;
  background:rgba(20,36,62,.9);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;color:var(--text);
}
.page-title h2{font-size:19px;font-weight:800;}
.card{
  background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));
  border:1px solid var(--border);
  backdrop-filter:blur(16px);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  position:relative;
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:18px;
  padding:1px;background:linear-gradient(135deg,rgba(0,209,255,.3),transparent);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.ref-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.ref-header h3{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;}
.ref-code-badge{padding:5px 9px;border-radius:7px;font-size:10px;font-weight:800;background:rgba(0,209,255,.15);color:var(--cyan);border:1px solid rgba(0,209,255,.25);}
.ref-code-box{
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:12px;padding:11px;display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.ref-code{font-size:17px;font-weight:800;letter-spacing:1.5px;color:var(--cyan);}
.copy-btn{padding:8px 11px;border-radius:8px;font-size:13px;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--green));border:none;color:#05121A;cursor:pointer;}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0;}
.level-card{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;}
.level-card h4{font-size:10px;color:var(--muted);margin-bottom:4px;letter-spacing:.5px;}
.level-card.percent{font-size:13px;font-weight:800;color:var(--green);}
.level-card.value{font-size:11px;font-weight:700;margin:4px 0;color:var(--text);}
.level-card.active{font-size:9px;color:var(--muted);}
.stats-3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px;}
.stat-3{background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;}
.stat-3.val{font-size:17px;font-weight:800;color:var(--text);}
.stat-3.lab{font-size:9px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:.5px;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab-btn{flex:1;padding:8px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.tab-btn.active{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;border-color:transparent;}
.milestone-card{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:7px;}
.milestone-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.milestone-left{display:flex;align-items:center;gap:8px;}
.badge{width:30px;height:30px;border-radius:8px;background:rgba(0,209,255,.15);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.title{font-size:12px;font-weight:700;}
.reward{font-size:11px;font-weight:700;color:var(--green);}
.progress-bar{height:5px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
.progress-bar.progress{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:10px;}
.directory-tabs{display:flex;gap:6px;margin:12px 0 9px;}
.dir-tab{padding:7px 12px;border-radius:18px;font-size:10px;font-weight:700;background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.dir-tab.active{background:rgba(0,209,255,.15);color:var(--cyan);border-color:rgba(0,209,255,.3);}
.team-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:6px;}
.team-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--green));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#05121A;}
.directory-msg{padding:15px;text-align:center;font-size:11px;color:var(--muted);background:rgba(0,0,0,.2);border:1px dashed var(--border);border-radius:12px;}

#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-20px);background:#0E1629;border:1px solid var(--border);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.3s;z-index:9999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:540px;height:74px;background:rgba(8,16,32,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 15px 45px rgba(0,0,0,.45);z-index:999;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;}
.nav-item.active{color:var(--cyan);font-weight:700;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;transition:.2s;}
.nav-item.active.nav-icon{background:rgba(0,209,255,.15);color:var(--cyan);box-shadow:0 0 18px rgba(0,209,255,.35);}
</style>
</head>
<meta name="google" content="notranslate">
<body>

<div class="container">
<div class="header">
<div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
<div class="page-title"><h2>Referral Network</h2></div>
</div>

<div class="card">
<div class="ref-header"><h3>INVITE FRIENDS & EARN</h3><span class="ref-code-badge">Level 1: 10%</span></div>
<div class="ref-code-box">
  <span class="ref-code" id="refCodeDisplay">SBXXXX</span>
  <button class="copy-btn" id="copyReferral" type="button"><i class="fa-regular fa-copy"></i></button>
</div>
<div class="levels">
<div class="level-card"><h4>LEVEL 1</h4><div class="percent">10%</div><div class="value" id="level1Earn">UGX 0</div><div class="active" id="level1Count">0 Active</div></div>
<div class="level-card"><h4>LEVEL 2</h4><div class="percent">5%</div><div class="value" id="level2Earn">UGX 0</div><div class="active" id="level2Count">0 Active</div></div>
<div class="level-card"><h4>LEVEL 3</h4><div class="percent">2%</div><div class="value" id="level3Earn">UGX 0</div><div class="active" id="level3Count">0 Active</div></div>
</div>
<div style="margin-top:10px;text-align:center;"><div class="value" id="refEarnings" style="font-size:16px;font-weight:800;">UGX 0</div><div class="lab" style="font-size:11px;color:#94A3B8;">TOTAL REFERRAL EARNINGS</div></div>
</div>

<div class="stats-3">
<div class="stat-3"><div class="val" id="totalTeam">0</div><div class="lab">TOTAL TEAM</div></div>
<div class="stat-3"><div class="val" id="activeToday">0</div><div class="lab">ACTIVE TODAY</div></div>
<div class="stat-3"><div class="val" id="activeWeek">0</div><div class="lab">ACTIVE WEEK</div></div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="daily">Daily Milestones</button>
  <button class="tab-btn" data-tab="weekly">Weekly Milestones</button>
</div>
<div id="milestonesList"></div>

<h3 style="margin:15px 0 8px;font-size:13px;font-weight:800;">TEAM DIRECTORY</h3>
<div class="directory-tabs">
<button class="dir-tab active" data-level="1">Level 1 <span id="l1count">(0)</span></button>
<button class="dir-tab" data-level="2">Level 2 <span id="l2count">(0)</span></button>
<button class="dir-tab" data-level="3">Level 3 <span id="l3count">(0)</span></button>
</div>
<div id="directoryList"><div class="directory-msg">Loading...</div></div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
<div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
<div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
<div class="nav-item" onclick="window.location='wallet.html'"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
<div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<div id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
let currentUser=null; let allUsers={}; let currentTab = 'daily'; let currentLevel = 1;
const dailyMilestones = [{count:3,reward:3000},{count:5,reward:6000},{count:10,reward:10000},{count:20,reward:20000}];
const weeklyMilestones = [{count:10,reward:15000},{count:20,reward:40000},{count:50,reward:120000},{count:100,reward:300000}];
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
document.getElementById("copyReferral").onclick = async () => {
  const code = document.getElementById("refCodeDisplay").textContent.trim();
  if(!code || code === "SBXXXX"){ showToast("Code not loaded yet"); return; }
  try{
    await navigator.clipboard.writeText(code);
    showToast("Referral code copied!");
    const icon = document.querySelector('#copyReferral i');
    icon.className = "fa-solid fa-check";
    setTimeout(()=> icon.className = "fa-regular fa-copy", 1200);
  }catch{
    const textArea = document.createElement("textarea");
    textArea.value = code;
    textArea.style.position = "fixed"; textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); showToast("Referral code copied!"); }
    catch { showToast("Long press to copy"); }
    document.body.removeChild(textArea);
  }
};
onAuthStateChanged(auth,(user)=>{
  if(!user){window.location="index.html";return;}
  currentUser=user;
  onValue(ref(db,"users"), (snapshot)=>{
    allUsers = snapshot.val() || {};
    loadTeamData();
    renderMilestones(currentTab);
    loadDirectory(currentLevel);
  });
});
function loadTeamData(){
  const me = allUsers[currentUser.uid] || {};
  const code = me.referralCode || "SB" + currentUser.uid.substring(0,6).toUpperCase();
  document.getElementById("refCodeDisplay").textContent = code;
  document.getElementById("totalTeam").textContent = me.teamCount || 0;
  document.getElementById("refEarnings").textContent = "UGX "+Number(me.referralEarnings||0).toLocaleString();
  let l1=[],l2=[],l3=[];
  Object.keys(allUsers).forEach(uid=>{ if(allUsers[uid].referrer === currentUser.uid){l1.push(uid);} });
  l1.forEach(uid=>{ Object.keys(allUsers).forEach(cid=>{ if(allUsers[cid].referrer === uid) l2.push(cid); }); });
  l2.forEach(uid=>{ Object.keys(allUsers).forEach(cid=>{ if(allUsers[cid].referrer === uid) l3.push(cid); }); });
  document.getElementById("l1count").textContent = `(${l1.length})`;
  document.getElementById("l2count").textContent = `(${l2.length})`;
  document.getElementById("l3count").textContent = `(${l3.length})`;
  document.getElementById("level1Count").textContent = `${l1.length} Active`;
  document.getElementById("level2Count").textContent = `${l2.length} Active`;
  document.getElementById("level3Count").textContent = `${l3.length} Active`;
}
function renderMilestones(type){
  const me = allUsers[currentUser.uid] || {};
  const teamCount = me.teamCount || 0;
  const milestones = type === 'weekly'? weeklyMilestones : dailyMilestones;
  const list = document.getElementById("milestonesList"); list.innerHTML="";
  milestones.forEach(m=>{
    const progress = Math.min(100, (teamCount/m.count)*100);
    list.innerHTML += `<div class="milestone-card"><div class="milestone-top"><div class="milestone-left"><div class="badge">${m.count}</div><div><div class="title">${m.count} Active Team Members</div><div style="font-size:12px;color:#94A3B8;">Reward: UGX ${m.reward.toLocaleString()}</div></div></div><div class="reward">UGX ${m.reward.toLocaleString()}</div></div><div class="progress-bar"><div class="progress" style="width:${progress}%"></div></div><div style="font-size:11px;color:#94A3B8;margin-top:6px;">${teamCount} / ${m.count} (${progress.toFixed(0)}%)</div></div>`;
  });
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    currentTab = e.currentTarget.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    renderMilestones(currentTab);
  });
});
document.querySelectorAll('.dir-tab').forEach(btn=>{
  btn.addEventListener('click', (e)=>{
    currentLevel = parseInt(e.currentTarget.dataset.level);
    document.querySelectorAll('.dir-tab').forEach(b=>b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    loadDirectory(currentLevel);
  });
});
function loadDirectory(level){
  let list=[];
  if(level===1) list = Object.keys(allUsers).filter(uid=>allUsers[uid].referrer===currentUser.uid);
  if(level===2) list = Object.keys(allUsers).filter(uid=>allUsers[allUsers[uid].referrer]?.referrer===currentUser.uid);
  if(level===3) list = Object.keys(allUsers).filter(uid=>allUsers[allUsers[allUsers[uid].referrer]?.referrer]?.referrer===currentUser.uid);
  const div = document.getElementById("directoryList");
  if(list.length===0){div.innerHTML=`<div class="directory-msg">No Level ${level} direct referrals found. Invite more people using your referral code to grow your network!</div>`;return;}
  div.innerHTML="";
  list.forEach(uid=>{
    const u = allUsers[uid] || {};
    const name = u.username || "User";
    const phone = u.phone? u.phone.substring(0,5) + "***" + u.phone.slice(-3) : "-";
    div.innerHTML += `<div class="team-item"><div class="team-avatar">${name.charAt(0).toUpperCase()}</div><div><div style="font-weight:700;">${name}</div><div style="font-size:12px;color:#94A3B8;">${phone}</div></div></div>`;
  });
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchstart', e => { if(e.touches.length > 1) e.preventDefault(); });
document.addEventListener('touchend', e => { if(e.touches.length > 1) e.preventDefault(); });
</script>
</body>
                                          </html>
