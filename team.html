<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>SenteBot | Team</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
:root{--bg:#070B14;--card:#111827;--card2:#182235;--green:#22C55E;--text:#F8FAFC;--muted:#94A3B8;--border:rgba(255,255,255,.08);--shadow:0 18px 45px rgba(0,0,0,.45);}
body{background:radial-gradient(circle at top,#14302a 0%,transparent 35%),linear-gradient(180deg,#08101E,#070B14);color:var(--text);min-height:100vh;padding-bottom:120px;}
.container{max-width:520px;margin:auto;padding:18px;}
.header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.back-btn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.page-title h2{font-size:20px;font-weight:800;}
.referral-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:22px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow);}
.referral-title{font-size:16px;font-weight:700;margin-bottom:12px;}
.referral-box{display:flex;gap:10px;background:#0E1627;border:1px solid var(--border);border-radius:14px;padding:14px;align-items:center;justify-content:space-between;}
.referral-code{font-size:22px;font-weight:800;color:#22C55E;letter-spacing:2px;}
.copy-btn{background:#22C55E;border:none;padding:12px 18px;border-radius:12px;color:#07111F;font-weight:700;cursor:pointer;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.stat-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:20px;padding:18px;text-align:center;}
.stat-value{font-size:24px;font-weight:800;color:#22C55E;margin:8px 0;}
.stat-label{font-size:12px;color:var(--muted);}
.team-list{display:flex;flex-direction:column;gap:12px;}
.team-item{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:14px;}
.team-avatar{width:44px;height:44px;border-radius:50%;background:#22C55E;display:flex;align-items:center;justify-content:center;font-weight:800;}
.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:520px;height:74px;background:rgba(13,20,34,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 15px 45px rgba(0,0,0,.45);z-index:999;}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;}
.nav-item.active{color:#22C55E;font-weight:700;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;}
.nav-item.active .nav-icon{background:rgba(34,197,94,.18);color:#22C55E;}
</style>
</head>
<body>

<div class="container">
<div class="header">
<div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
<div class="page-title"><h2>My Team</h2></div>
</div>

<div class="referral-card">
<div class="referral-title">Your Referral Code</div>
<div class="referral-box">
<div class="referral-code" id="refCode">SBXXXXXX</div>
<button class="copy-btn" onclick="copyRef()">Copy</button>
</div>
<p style="color:#94A3B8;font-size:12px;margin-top:10px;">Share this code. When someone uses it, you earn rewards.</p>
</div>

<div class="stats-grid">
<div class="stat-card"><div class="stat-value" id="teamCount">0</div><div class="stat-label">Team Members</div></div>
<div class="stat-card"><div class="stat-value" id="refEarnings">UGX 0</div><div class="stat-label">Referral Earnings</div></div>
</div>

<div class="team-list" id="teamList"></div>
</div> <!-- CLOSED CONTAINER -->

<div class="bottom-nav">
<div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
<div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
<div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
<div class="nav-item" onclick="window.location='wallet.html'"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
<div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, query, orderByChild, equalTo, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"; // added update

const firebaseConfig={apiKey:"AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",authDomain:"sentebot-7428b.firebaseapp.com",databaseURL:"https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sentebot-7428b",storageBucket:"sentebot-7428b.firebasestorage.app",messagingSenderId:"24568208668",appId:"1:24568208668:web:e01e4001149dfa93eeaed9"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);
let currentUser=null;

onAuthStateChanged(auth,(user)=>{if(!user){window.location="index.html";return;}currentUser=user;loadTeam();});

function loadTeam(){
const userRef=ref(db,"users/"+currentUser.uid);
onValue(userRef,(snap)=>{
if(!snap.exists())return;const data=snap.val();
const refCode=data.referralCode||currentUser.uid.substring(0,8).toUpperCase();
document.getElementById("refCode").textContent=refCode;
document.getElementById("teamCount").textContent=data.teamCount||0;
document.getElementById("refEarnings").textContent="UGX "+Number(data.referralEarnings||0).toLocaleString();

const teamQuery=query(ref(db,"users"),orderByChild("referrer"),equalTo(currentUser.uid));
onValue(teamQuery,(teamSnap)=>{
const list=document.getElementById("teamList");list.innerHTML="";
if(!teamSnap.exists()){list.innerHTML='<p style="color:#94A3B8;text-align:center;">No referrals yet</p>';return;}
teamSnap.forEach(child=>{
const u=child.val();
list.innerHTML+=`<div class="team-item"><div class="team-avatar">${u.username.charAt(0).toUpperCase()}</div><div><div style="font-weight:700;">${u.username}</div><div style="font-size:12px;color:#94A3B8;">${u.phone}</div></div></div>`;
});
}

window.copyRef=()=>{navigator.clipboard.writeText(document.getElementById("refCode").textContent);alert("Referral code copied!");}
</script>
</body>
</html>
