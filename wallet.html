<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>SenteBot-AI Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
:root{
  --bg:#050A18;--card:#0E1629;--card2:#14243E;--green:#00E676;--cyan:#00D1FF;--red:#EF4444;
  --text:#F8FAFC;--muted:#94A3B8;--border:rgba(0,209,255,.15);--shadow:0 18px 45px rgba(0,0,0,.45);
  --glow-cyan:0 0 25px rgba(0,209,255,.25);--glow-green:0 0 25px rgba(0,230,118,.25);
}
/* Prevent whole page scrolling: container fills viewport, internal scroll only */
body{background:radial-gradient(1200px 600px at 50% -20%,rgba(0,209,255,.12),transparent 60%),linear-gradient(180deg,#050A18,#070B14);color:var(--text);min-height:100vh;padding-bottom:120px;overflow:hidden;}
.container{max-width:540px;margin:auto;padding:16px;height:calc(100vh - 36px);display:flex;flex-direction:column;}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  /* BLOCK CHROME TAP TO SEARCH + LONG PRESS */
*{
  -webkit-touch-callout: none; /* iOS long press menu */
  -webkit-user-select: none;   /* Safari */
   -khtml-user-select: none;   /* Konqueror */
     -moz-user-select: none;   /* Firefox */
      -ms-user-select: none;   /* IE/Edge */
          user-select: none;   /* Standard */
}

/* Allow selection only in inputs */
input, textarea{
  -webkit-user-select: text;
     -moz-user-select: text;
      -ms-user-select: text;
          user-select: text;
}
.back-btn{width:42px;height:42px;border-radius:14px;background:rgba(0,209,255,.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
.page-title{text-align:center;flex:1;}
.page-title h2{font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* BALANCE CARD - REDUCED */
.balance-card{background:linear-gradient(180deg,rgba(20,36,62,.9),rgba(14,22,41,.9));border-radius:22px;padding:20px;border:1px solid var(--border);box-shadow:var(--glow-cyan);margin-bottom:16px;position:relative}
.balance-card::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(130deg,var(--cyan),transparent 40%,var(--green));-webkit-mask:linear-gradient(#fff, rgba(255,255,255,0));pointer-events:none}
.balance-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.balance-value{font-size:28px;font-weight:800;margin:8px 0;background:linear-gradient(90deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.balance-stats{display:flex;gap:12px;margin-top:14px;}
.stat-box{flex:1;background:rgba(0,0,0,.25);padding:10px;border-radius:12px;border:1px solid var(--border);}
.stat-box small{color:var(--muted);font-size:10px;}
.stat-box strong{font-size:13px;font-weight:800;white-space:nowrap;}

/* ACTION BUTTONS */
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.action-btn{height:50px;border:none;border-radius:16px;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.3s;}
.deposit{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;box-shadow:var(--glow-cyan);}
.withdraw{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red);}
.action-btn:active{transform:scale(.97);}

/* TRANSACTION FILTER - BIGGER */
.filter-tabs{display:flex;gap:10px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.filter-tab{padding:12px 20px;border-radius:30px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s;}
.filter-tab:active{transform:scale(.96);}
.filter-tab.active{background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;border:none;box-shadow:var(--glow-cyan);}

/* Transactions container card */
/* keep the card slightly shorter so it doesn't get hidden under the fixed bottom-nav */
.transactions-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:110px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;flex:1}
.tx-list{overflow:auto;padding-right:6px;padding-bottom:110px}

/* TRANSACTION LIST - AMOUNT IN 1 LINE */
.tx-card{background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(255,255,255,.02));border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px;border:1px solid transparent;}
.tx-card:hover{border-color:var(--cyan);}
.tx-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.02)}
.tx-deposit{background:rgba(0,230,118,.12);color:var(--green);}
.tx-withdraw{background:rgba(239,68,68,.08);color:var(--red);}
.tx-machine{background:rgba(0,209,255,.08);color:var(--cyan);}
.tx-info{flex:1;min-width:0;}
.tx-title{font-size:14px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-time{font-size:11px;color:var(--muted);}
.tx-amount{font-size:14px;font-weight:800;white-space:nowrap;margin-left:auto;flex-shrink:0;}
.tx-amount.positive{color:var(--green);}
.tx-amount.negative{color:var(--red);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty i{font-size:50px;color:var(--cyan);margin-bottom:14px;}

.bottom-nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 26px);max-width:540px;height:74px;background:rgba(8,16,32,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;display:flex;align-items:center;padding:10px;gap:6px;box-shadow:var(--shadow)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;font-size:11px;color:var(--muted);cursor:pointer;text-align:center}
.nav-item.active{color:var(--cyan);font-weight:700;}
.nav-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;font-size:22px;transition:.2s;}
.nav-item.active .nav-icon{background:rgba(0,209,255,.15);color:var(--cyan);}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:linear-gradient(90deg,var(--cyan),var(--green));color:#05121A;padding:12px 20px;border-radius:14px;font-weight:800;display:none}

/* small screens adjustments */
@media (max-height:700px){
  .container{height:calc(100vh - 10px)}
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title"><h2>Wallet</h2></div>
        <div style="width:42px;"></div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-value" id="walletBalance">UGX 0</div>
        <div class="balance-stats">
            <div class="stat-box">
                <small>Today's Profit</small>
                <strong id="todayProfit">UGX 0</strong>
            </div>
            <div class="stat-box">
                <small>Referral Earnings</small>
                <strong id="referralEarnings">UGX 0</strong>
            </div>
        </div>
    </div>

    <div class="wallet-actions">
        <button class="action-btn deposit" onclick="window.location='deposit.html'"><i class="fa-solid fa-arrow-down"></i> Deposit</button>
        <button class="action-btn withdraw" onclick="window.location='withdraw.html'"><i class="fa-solid fa-arrow-up"></i> Withdraw</button>
    </div>

    <div class="filter-tabs">
        <div class="filter-tab active" data-filter="All">All</div>
        <div class="filter-tab" data-filter="Deposit">Deposits</div>
        <div class="filter-tab" data-filter="Withdraw">Withdrawals</div>
        <div class="filter-tab" data-filter="Profit">Profits</div>
    </div>

    <!-- Transactions card: single box with internal scroll -->
    <div class="transactions-card">
        <div id="transactionList" class="tx-list"></div>
    </div>
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
<div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
<div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
<div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
<div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser = null;
let allTransactions = [];
let currentFilter = "All";

let lastTouchEnd = 0;
document.addEventListener('touchend', function (event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

function showToast(message){
    const toast=document.getElementById("toast");
    toast.textContent=message;
    toast.style.display="block";
    setTimeout(()=>{toast.style.display="none";},3000);
}

onAuthStateChanged(auth,(user)=>{
    if(!user){window.location.href="index.html";return;}
    currentUser = user;
    loadWallet();
});

function loadWallet(){
    const userRef = ref(db,"users/" + currentUser.uid);
    onValue(userRef,(snapshot)=>{
        if(!snapshot.exists()) return;
        const data = snapshot.val();

        document.getElementById("walletBalance").textContent = "UGX " + Number(data.balance || 0).toLocaleString();
        document.getElementById("todayProfit").textContent = "UGX " + Number(data.todayProfit || 0).toLocaleString();
        document.getElementById("referralEarnings").textContent = "UGX " + Number(data.referralEarnings || 0).toLocaleString();

        const activities = data.activities
    ? Object.values(data.activities).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0))
    : [];
        allTransactions = activities;
        renderTransactions();
    });
}

function renderTransactions(){
    const container = document.getElementById("transactionList");
    let txs = allTransactions || [];

    if(currentFilter !== "All"){
      txs = allTransactions.filter(tx => {
        const title = (tx.title || "").toLowerCase();

        if(currentFilter === "Deposit") return (tx.amount || "").includes("+") || title.includes("deposit");
        if(currentFilter === "Withdraw") return (tx.amount || "").includes("-") || title.includes("withdraw");
        if(currentFilter === "Profit") return title.includes("profit") || title.includes("bonus") || title.includes("promo");

        return true;
      });
    }

    if(txs.length === 0){
        container.innerHTML = `<div class="empty"><i class="fa-solid fa-receipt"></i><h3>No Transactions Yet</h3><p>Your deposit, withdrawal and profit history will appear here.</p></div>`;
        return;
    }

    container.innerHTML = "";
    txs.forEach(tx => {
        let iconClass = "tx-machine";
        let icon = "fa-solid fa-microchip";
        let amountClass = "positive";

        const amountText = (tx.amount || "").toString();
        const title = (tx.title || "").toLowerCase();

        if(amountText.includes("-")){
            iconClass = "tx-withdraw";
            icon = "fa-solid fa-arrow-up";
            amountClass = "negative";
        } else if(title.includes("deposit") || amountText.includes("+")){
            iconClass = "tx-deposit";
            icon = "fa-solid fa-arrow-down";
            amountClass = "positive";
        } else if(title.includes("profit") || title.includes("bonus") || title.includes("promo")){
            iconClass = "tx-machine";
            icon = "fa-solid fa-gift";
            amountClass = "positive";
        } else {
            // default
            iconClass = "tx-machine";
            icon = "fa-solid fa-microchip";
            amountClass = "positive";
        }

        const timeText = tx.time || (tx.timestamp ? new Date(tx.timestamp).toLocaleString() : "");

        const item = `
        <div class="tx-card">
            <div class="tx-icon ${iconClass}"><i class="${icon}"></i></div>
            <div class="tx-info">
                <div class="tx-title">${escapeHtml(tx.title || "Transaction")}</div>
                <div class="tx-time">${escapeHtml(timeText)}</div>
            </div>
            <div class="tx-amount ${amountClass}">${escapeHtml(amountText)}</div>
        </div>`;

        container.innerHTML += item;
    });
}

// simple escape to avoid breaking layout if data contains html
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}

// Filter tab behavior
document.querySelectorAll(".filter-tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        renderTransactions();
    });
});

// Block long press and right click
document.addEventListener('contextmenu', e => e.preventDefault());
// Prevent multi-touch pinch
document.addEventListener('touchstart', e => { if(e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});

// Block 500ms long press (simplified)
let touchTimer;
document.addEventListener('touchstart', e => {
  if(e.touches && e.touches.length === 1){
    touchTimer = setTimeout(()=>{}, 500);
  }
});
document.addEventListener('touchend', () => clearTimeout(touchTimer));
document.addEventListener('touchmove', () => clearTimeout(touchTimer));
</script>
</body>
</html>
