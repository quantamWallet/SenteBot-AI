<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="google" content="notranslate">
<title>SenteBot — Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
--bg:#050a14;--card:#0e1a30;--card2:#111f38;
--border:rgba(255,255,255,.06);--border2:rgba(34,211,238,.12);
--text:#f1f5f9;--muted:#8b9bb0;
--green:#34d399;--cyan:#22d3ee;--red:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(800px 400px at 50% -10%,rgba(34,211,238,.08),transparent 70%),linear-gradient(180deg,#050a14,#080f20);color:var(--text);min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.container{max-width:500px;margin:auto;padding:14px 12px 0}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back-btn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.page-title h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
.balance-card{position:relative;background:linear-gradient(135deg,#101e36,#0c172c);border-radius:18px;padding:18px;border:1px solid var(--border2);box-shadow:0 12px 30px rgba(0,0,0,.25);margin-bottom:14px;overflow:hidden}
.balance-card::before{content:"";position:absolute;width:200px;height:200px;right:-60px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%)}
.balance-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.balance-value{font-size:28px;font-weight:900;margin:6px 0;letter-spacing:-.6px}
.balance-stats{display:flex;gap:8px;margin-top:12px}
.stat-box{flex:1;background:rgba(0,0,0,.22);padding:9px 10px;border-radius:11px;border:1px solid var(--border)}
.stat-box small{color:var(--muted);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat-box strong{display:block;margin-top:3px;font-size:12px;font-weight:800;white-space:nowrap}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.action-btn{height:48px;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.action-btn:active{transform:scale(.97)}
.deposit{background:linear-gradient(90deg,var(--cyan),var(--green));color:#02120e}
.withdraw{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.18);color:var(--red)}
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.filter-tab{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--muted);transition:.2s}
.filter-tab.active{background:rgba(34,211,238,.12);color:var(--cyan);border-color:var(--border2)}
.transactions-card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:16px;padding:10px;min-height:220px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.tx-list{max-height:58vh;overflow-y:auto;padding-right:2px}
.tx-list::-webkit-scrollbar{width:3px}.tx-list::-webkit-scrollbar-thumb{background:rgba(34,211,238,.25);border-radius:10px}
.tx-card{background:rgba(0,0,0,.18);border-radius:11px;padding:11px;margin-bottom:7px;display:flex;align-items:center;gap:10px;border:1px solid transparent;transition:.15s}
.tx-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tx-deposit{background:rgba(52,211,153,.10);color:var(--green)}.tx-withdraw{background:rgba(248,113,113,.10);color:var(--red)}.tx-machine{background:rgba(34,211,238,.10);color:var(--cyan)}
.tx-info{flex:1;min-width:0}.tx-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-time{font-size:9px;color:var(--muted);margin-top:2px}.tx-amount{font-size:12px;font-weight:800;white-space:nowrap;margin-left:auto;flex-shrink:0}
.tx-amount.positive{color:var(--green)}.tx-amount.negative{color:var(--red)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty i{font-size:36px;color:var(--cyan);margin-bottom:10px;display:block}
.bottom-nav{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:500px;height:70px;background:rgba(10,20,38,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:999}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;font-size:10px;color:var(--muted);cursor:pointer;text-decoration:none}
.nav-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:20px;transition:.2s}
.nav-item.active{color:var(--cyan);font-weight:700}.nav-item.active .nav-icon{background:rgba(34,211,238,.12)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:linear-gradient(90deg,var(--cyan),var(--green));color:#02120e;padding:10px 18px;border-radius:12px;font-weight:800;font-size:12px;display:none;z-index:9999}
.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
    <div class="header">
        <div class="back-btn" onclick="window.location='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="page-title"><h2>Wallet</h2></div>
        <div style="width:36px;"></div>
    </div>
    <div class="balance-card">
        <div class="balance-label">Total Balance • Secured</div>
        <div class="balance-value" id="walletBalance">UGX 0</div>
        <div class="balance-stats">
            <div class="stat-box"><small>Today's Profit</small><strong id="todayProfit">UGX 0</strong></div>
            <div class="stat-box"><small>Referral Earnings</small><strong id="referralEarnings">UGX 0</strong></div>
        </div>
    </div>
    <div class="wallet-actions">
        <button class="action-btn deposit" onclick="window.location='deposit.html'"><i class="fa-solid fa-arrow-down"></i> Deposit</button>
        <button class="action-btn withdraw" onclick="window.location='withdraw.html'"><i class="fa-solid fa-arrow-up"></i> Withdraw</button>
    </div>
    <div class="filter-tabs">
        <div class="filter-tab active" data-filter="All">All</div>
        <div class="filter-tab" data-filter="Deposit">Deposits</div>
        <div class="filter-tab" data-filter="Withdraw">Withdrawals</div>
        <div class="filter-tab" data-filter="Profit">Profits</div>
    </div>
    <div class="transactions-card">
        <div id="transactionList" class="tx-list"><div style="text-align:center;color:var(--muted);padding:20px;font-size:11px">Loading transactions...</div></div>
    </div>
</div>
<div class="bottom-nav" id="bottomNav">
<div class="nav-item" onclick="window.location='dashboard.html'"><div class="nav-icon"><i class="fa-solid fa-house"></i></div><span>Home</span></div>
<div class="nav-item" onclick="window.location='team.html'"><div class="nav-icon"><i class="fa-solid fa-users"></i></div><span>Team</span></div>
<div class="nav-item" onclick="window.location='machines.html'"><div class="nav-icon"><i class="fa-solid fa-microchip"></i></div><span>Machines</span></div>
<div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-wallet"></i></div><span>Wallet</span></div>
<div class="nav-item" onclick="window.location='profile.html'"><div class="nav-icon"><i class="fa-solid fa-user"></i></div><span>Profile</span></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBYyhhCCjiOQAJHZrnXDyLx9l39XiL-9K8",
  authDomain: "sentebot-7428b.firebaseapp.com",
  databaseURL: "https://sentebot-7428b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sentebot-7428b",
  storageBucket: "sentebot-7428b.firebasestorage.app",
  messagingSenderId: "24568208668",
  appId: "1:24568208668:web:e01e4001149dfa93eeaed9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser=null, allTransactions=[], currentFilter="All", lastHash="", lastBalance=0;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
function silentUpdate(id,value){
  const el=document.getElementById(id); if(!el) return;
  if(el.textContent!==value){ el.textContent=value; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}
onAuthStateChanged(auth,(user)=>{
    if(!user){location.href="index.html";return;}
    currentUser=user;
    attachListener();
});
function attachListener(){
    const userRef=ref(db,"users/"+currentUser.uid);
    onValue(userRef,(snap)=>{
        if(!snap.exists()) return;
        const data=snap.val();
        // silent balance updates like crypto apps
        const bal=Number(data.balance||0);
        if(bal!==lastBalance){
          silentUpdate("walletBalance","UGX "+bal.toLocaleString());
          lastBalance=bal;
        }
        silentUpdate("todayProfit","UGX "+Number(data.todayProfit||0).toLocaleString());
        silentUpdate("referralEarnings","UGX "+Number(data.referralEarnings||0).toLocaleString());
        const activities=data.activities?Object.values(data.activities).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)):[];
        const hash=JSON.stringify(activities).length+"_"+activities.length;
        if(hash!==lastHash){
          allTransactions=activities;
          renderTransactions();
          lastHash=hash;
        }
    });
}
function renderTransactions(){
    const container=document.getElementById("transactionList");
    let txs=allTransactions||[];
    if(currentFilter!=="All"){
      txs=txs.filter(tx=>{
        const title=(tx.title||"").toLowerCase();
        const amt=String(tx.amount||"");
        if(currentFilter==="Deposit") return amt.includes("+")||title.includes("deposit");
        if(currentFilter==="Withdraw") return amt.includes("-")||title.includes("withdraw");
        if(currentFilter==="Profit") return title.includes("profit")||title.includes("bonus")||title.includes("promo");
        return true;
      });
    }
    if(txs.length===0){
        container.innerHTML=`<div class="empty"><i class="fa-solid fa-receipt"></i><h3>No Transactions Yet</h3><p>Your history will appear here silently.</p></div>`;
        return;
    }
    container.innerHTML=txs.map(tx=>{
        let iconClass="tx-machine", icon="fa-solid fa-microchip", amountClass="positive";
        const amt=(tx.amount||"").toString();
        const title=(tx.title||"").toLowerCase();
        if(amt.includes("-")){iconClass="tx-withdraw";icon="fa-solid fa-arrow-up";amountClass="negative";}
        else if(title.includes("deposit")){iconClass="tx-deposit";icon="fa-solid fa-arrow-down";}
        else if(title.includes("profit")||title.includes("bonus")||title.includes("promo")){iconClass="tx-machine";icon="fa-solid fa-gift";}
        const timeText=tx.time||(tx.timestamp?new Date(tx.timestamp).toLocaleString():"");
        return `<div class="tx-card"><div class="tx-icon ${iconClass}"><i class="${icon}"></i></div><div class="tx-info"><div class="tx-title">${esc(tx.title||"Transaction")}</div><div class="tx-time">${esc(timeText)}</div></div><div class="tx-amount ${amountClass}">${esc(amt)}</div></div>`;
    }).join("");
}
document.querySelectorAll(".filter-tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
        document.querySelectorAll(".filter-tab").forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter=tab.dataset.filter;
        renderTransactions();
    });
});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
  </html>
